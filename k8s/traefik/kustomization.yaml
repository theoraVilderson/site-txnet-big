# Traefik's CRDs and the rights its CRD provider reads them with (hosting K9),
# vendored unchanged at TRAEFIK_CRD_VERSION; only the binding's namespace is ours.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crds.yaml
  - rbac.yaml
  - service-account.yaml
patches:
  - target:
      kind: ClusterRoleBinding
      name: traefik-ingress-controller
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: txnet
