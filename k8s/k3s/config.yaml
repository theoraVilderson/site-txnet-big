# The k3s server's flags (hosting K1, K5), copied to /etc/rancher/k3s/config.yaml
# on the node before k3s is installed (OPS-1-o-f). servicelb and local-path stay on.
# We run our own Traefik (K9).
disable:
  - traefik
# Secrets are stored encrypted in k3s's datastore (ADR-0164 point 6), so a copy
# of /var/lib/rancher holds no Secret in the clear.
secrets-encryption: true
# Node-to-node traffic crosses the public network (or a provider's private one),
# so flannel encrypts it on every path (K17). Agents follow the server's choice.
flannel-backend: wireguard-native
# The stores' local-path volumes, Traefik and every other pod holding a claim
# or a host path stay on this node (K17); a server registers with the label.
node-label:
  - txnet.io/data=true
# A release is a new tag for every image, so the kubelet asks the registry for
# each one; serially, the last of 22 waited ~3 min and missed K10's 300s
# (OPS-1-o-f). Four at once: a cached image is a manifest round trip.
kubelet-arg:
  - serialize-image-pulls=false
  - max-parallel-image-pulls=4
