services:
  3eora-mitm-proxy:
    container_name: 3eora-mitm-proxy
    build:
      context: ./code # مسیری که فایل‌های پروژه و Dockerfile در آن قرار دارند
      dockerfile: Dockerfile # نام فایل Dockerfile شما

    restart: unless-stopped # برای اینکه در صورت ریستارت سرور یا کرش، خودکار بالا بیاید

    environment:
      # متغیرهای مربوط به کامپایلر (مثل GOPATH) حذف شدند چون برنامه از قبل بیلد شده است
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=${S3_REGION}
      - LISTEN_PORT=${LISTEN_PORT}
      - CA_KEY=${CA_KEY}
      - CA_CERT=${CA_CERT}
      - SOCKS_PROXY=${SOCKS_PROXY}
      - SOCKS_PROXY_USER=${SOCKS_PROXY_USER}
      - SOCKS_PROXY_PASS=${SOCKS_PROXY_PASS}

    # دستور command حذف شد؛ داکر به صورت پیش‌فرض از CMD داخل Dockerfile شما استفاده می‌کند

    networks:
      txnet-network: {}
      private_backend_network:
        ipv4_address: 172.22.100.10

# بخش volumes مربوط به کش Go کاملاً حذف شد چون در ایمیج نهایی Alpine اصلاً Go وجود ندارد

networks:
  txnet-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

  private_backend_network:
    external: true
    name: private_backend_network
