# Guide videos, served from the object-storage volume by nginx (F-414-i,
# ADR-0118). Traefik strips `/api/public/media`, so a request arrives as the
# object key: `/tenants/<tenantId>/guides/<guideId>/<uuid>.<mp4|webm>`.
#
# This server reads the whole volume and checks no Host and no tenant, so the
# one `location` below is the whole of its safety: only a guide video key the
# port mints (lower-case uuids, never `.tmp`, never `..`) is served, and every
# other path — branding, support attachments, images — is a 404. Images keep
# the file route, which holds them to the Host's tenant.
# `guide-video.spec.ts` reads this file and holds it to that.

server {
    listen 8080;
    server_name _;
    root /data/objects;

    server_tokens off;
    autoindex off;
    disable_symlinks on;

    # Range is nginx's own (sendfile, 206); nothing here buffers a video.
    sendfile on;
    tcp_nopush on;

    types {
        video/mp4  mp4;
        video/webm webm;
    }
    default_type application/octet-stream;

    location ~ "^/tenants/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/guides/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(mp4|webm)$" {
        limit_except GET { deny all; }
        # A key is minted once per upload and never rewritten, so it is kept a year.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

# The in-network port (F-414-f): the bot sends a guide's pictures and video
# into the chat, so it reads every guide file — images too — by key. Traefik
# routes nothing here; only containers on the private network reach it, and
# it still serves nothing but `guides/` files the port minted.
server {
    listen 8081;
    server_name _;
    root /data/objects;

    server_tokens off;
    autoindex off;
    disable_symlinks on;
    sendfile on;

    types {
        video/mp4  mp4;
        video/webm webm;
        image/png  png;
        image/jpeg jpg;
        image/webp webp;
    }
    default_type application/octet-stream;

    location ~ "^/tenants/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/guides/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(mp4|webm|png|jpg|webp)$" {
        limit_except GET { deny all; }
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

# The container's healthcheck (hosting H24), on loopback only: nothing outside
# this container reaches it, and the two servers above stay key-only.
server {
    listen 127.0.0.1:8082;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 200;
    }

    location / {
        return 404;
    }
}
