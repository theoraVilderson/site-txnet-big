# pgBackRest, the fixed part (hosting/contract.md H2). Where the repository is
# and the cipher passphrase are decided at start by pgbackrest-repo.sh, into
# conf.d/repo.conf, because they come from env and a secret file.
[global]
repo1-retention-full=2
repo1-cipher-type=aes-256-cbc
compress-type=zst
process-max=2
start-fast=y
log-level-console=info
# Container logs are the log; a file under /var/log would grow unbounded (H11).
log-level-file=off

[txnet]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
