# RADIUS_ACCT_ADDR's stand-in for probe.sh check 3: a FreeRADIUS that only
# acknowledges accounting and writes every packet to /tmp/radacct.detail. It
# answers, as our receiver does — a server that never answers is soon skipped
# by the NAS, which would prove nothing. The guest reaches it as 10.0.2.2:1825.
prefix = /usr
localstatedir = /tmp
logdir = /tmp
raddbdir = /etc/raddb
confdir = ${raddbdir}
run_dir = /tmp
libdir = /usr/lib/freeradius
pidfile = /tmp/acct-probe.pid
name = radiusd

log {
	destination = files
	file = /tmp/acct-probe.log
}

security {
	allow_core_dumps = no
}

client nas {
	ipaddr = 127.0.0.1
	secret = $ENV{CHR_RADIUS_SECRET}
}

modules {
	detail {
		filename = /tmp/radacct.detail
		permissions = 0600
		header = "%t"
	}
	always ok {
		rcode = ok
	}
}

server acct {
	listen {
		type = acct
		ipaddr = 127.0.0.1
		port = 1825
	}
	accounting {
		detail
		ok
	}
}
