# =============================================================================
# TXNet — alert rules for Postgres's backup and its disk (OPS-1-d, ADR-0126,
# hosting/contract.md H5). Tests: database.rules.test.yml (`promtool test rules`).
# =============================================================================
# The backup and the drill write their outcome to node-exporter's textfile
# directory (`dev-docker/postgres/pg-backup.sh`): pg_backup.prom after every
# backup, pg_restore_drill.prom after every drill, pg_data_fs.prom — the data
# volume's filesystem, measured from inside pg-backup so the right disk is
# found on any host without naming its mountpoint here. WAL archiving is
# Postgres's own `pg_stat_archiver`, read by postgres-exporter
# (`hosting_wal_archive` in postgres-queries.yaml).
#
# A backup that is not running writes nothing, so "never recorded" fires too.
# The restore runbook is docs/operations/runbook-restore-database.md.
#
# The backup bundle (OPS-1-ad): backup.py writes backup_bundle.prom, and the
# count of bundles not yet in S3 to backup_bundle_ship.prom.
#
# hosting.broker-redis (OPS-1-v, H21): the broker and Redis, the two stores a
# full memory stops without a word — RabbitMQ blocks every publisher, Redis
# (noeviction) refuses every write.
# =============================================================================

groups:
  - name: hosting.postgres-backup
    rules:
      - alert: PgBackupFailed
        expr: txnet_pg_backup_last_run_success == 0
        for: 5m
        labels:
          severity: critical
          unit: hosting
        annotations:
          summary: "The last Postgres backup failed"
          description: >-
            pg-backup's last pgBackRest run did not finish. Earlier backups and
            the archived WAL are still in the repository. See
            `docker logs txnet-pg-backup`; a wrong passphrase reads as
            "backup.info cannot be opened" (it cannot be decrypted), an
            unreachable repository as a connect error.
            Run it again with
            `docker exec txnet-pg-backup sh /usr/local/bin/pg-backup.sh diff`.

      # 36h: one missed night plus the time a run takes, as ObjectBackupStale.
      - alert: PgBackupStale
        expr: |
          (time() - txnet_pg_backup_last_success_timestamp_seconds) > 36 * 3600
            or absent(txnet_pg_backup_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: critical
          unit: hosting
        annotations:
          summary: "No Postgres backup has succeeded in 36 hours"
          description: >-
            No successful pgBackRest backup since
            {{ with query "txnet_pg_backup_last_success_timestamp_seconds" }}{{ . | first | value | humanizeTimestamp }}{{ else }}ever{{ end }}.
            If txnet-pg-backup is not running, nothing is recorded at all; start
            it. Point-in-time restore reaches back only to the oldest backup kept.

      # 8 days: the drill runs every Sunday, so one missed Sunday plus a day.
      - alert: PgRestoreDrillStale
        expr: |
          (time() - txnet_pg_restore_drill_last_success_timestamp_seconds) > 8 * 86400
            or absent(txnet_pg_restore_drill_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
          unit: hosting
        annotations:
          summary: "No Postgres restore drill has passed in 8 days"
          description: >-
            A backup nobody has restored is not yet known to restore. Last pass:
            {{ with query "txnet_pg_restore_drill_last_success_timestamp_seconds" }}{{ . | first | value | humanizeTimestamp }}{{ else }}never{{ end }}.
            Run it by hand with
            `docker exec txnet-pg-backup sh /usr/local/bin/pg-backup.sh drill`
            and read its log lines.

      # The nightly bundle (OPS-1-ad, 03:00 UTC): 26h is one missed night plus two
      # hours. Written by scripts/bundle/backup.py into backup_bundle.prom.
      - alert: BackupBundleStale
        expr: |
          (time() - txnet_backup_bundle_last_success_timestamp_seconds) > 26 * 3600
            or absent(txnet_backup_bundle_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: critical
          unit: hosting
        annotations:
          summary: "No backup bundle has been made in 26 hours"
          description: >-
            The one file a lost server is restored from (runbook-backup-bundle.md)
            is older than a day. Last bundle:
            {{ with query "txnet_backup_bundle_last_success_timestamp_seconds" }}{{ . | first | value | humanizeTimestamp }}{{ else }}never{{ end }}.
            `journalctl -u txnet-backup.service`; by hand,
            `python3 scripts/bundle/backup.py now`.

      # Two bundles waiting means S3 is a day behind, or shipping was never set
      # up: either way S3 holds nothing newer than the last one it got.
      - alert: BackupBundleNotShipped
        expr: txnet_backup_bundle_unshipped >= 2
        for: 1h
        labels:
          severity: warning
          unit: hosting
        annotations:
          summary: "{{ $value }} backup bundles are not in S3"
          description: >-
            ship.py has not sent them. No dev-docker/secrets/backup-ship.env
            means shipping is not set up yet; otherwise
            `journalctl -u txnet-backup-ship.service` says why.

      # Postgres retries a failed segment every minute: the count rising while
      # the newest failure is later than the newest success is a stuck archive,
      # and every segment it holds back is lost to point-in-time restore — and
      # stays in pg_wal, filling the disk PgWalDiskHigh watches.
      - alert: PgArchiveFailing
        expr: |
          increase(hosting_wal_archive_failed_count[5m]) > 0
            and hosting_wal_archive_last_failed_seconds > hosting_wal_archive_last_archived_seconds
        for: 15m
        labels:
          severity: critical
          unit: hosting
        annotations:
          summary: "Postgres cannot archive WAL"
          description: >-
            archive_command has been failing for 15 minutes. Point-in-time
            restore stops at the last archived segment, and pg_wal grows until
            the disk is full. See `docker logs txnet-postgres` for the
            pgbackrest archive-push error.

      - alert: PgWalDiskHigh
        expr: 1 - txnet_pg_data_fs_avail_bytes / txnet_pg_data_fs_size_bytes > 0.80
        for: 10m
        labels:
          severity: warning
          unit: hosting
        annotations:
          summary: "Postgres's disk is {{ $value | humanizePercentage }} full"
          description: >-
            The filesystem under main-db's data volume is over 80% used.
            Postgres stops writing when it is full. Check pg_wal first (a stuck
            archive keeps every segment, PgArchiveFailing), then
            `docker system df -v`.

  - name: hosting.broker-redis
    rules:
      # An alarm blocks every publishing connection: outbox relays, bot
      # webhooks and payments all stall until it clears.
      - alert: RabbitAlarm
        expr: |
          rabbitmq_alarms_memory_used_watermark == 1
            or rabbitmq_alarms_free_disk_space_watermark == 1
        for: 1m
        labels:
          severity: critical
          unit: hosting
        annotations:
          summary: "RabbitMQ has raised a resource alarm and blocks publishers"
          description: >-
            The broker is over its memory watermark or under its free-disk
            limit, so every publisher is blocked. Find the queue holding the
            messages with
            `docker exec txnet-rabbitmq rabbitmqctl list_queues name messages`,
            and free the disk (`df -h`, `docker system df -v`).

      # Per shard: one shard whose consumer died backs up while the others
      # drain, and a sum over all four would hide it for longer.
      - alert: BotUpdateBacklog
        expr: rabbitmq_detailed_queue_messages_ready{queue=~"txnet\\.automation\\.bot\\.update\\..+"} > 500
        for: 5m
        labels:
          severity: critical
          unit: hosting
        annotations:
          summary: "{{ $labels.queue }} has {{ $value }} bot updates waiting"
          description: >-
            Bot updates on this shard are not being consumed: the bots answer
            nobody on the chats it holds. Check bot-service is running and
            consuming (`rabbitmq_detailed_queue_consumers`) and its logs.
            Updates older than BOT_UPDATE_STALE_MS are dropped on arrival (H19).

      # noeviction: at maxmemory Redis refuses writes, and a refused write is a
      # refused sign-in or session. The `> 0` guard: no maxmemory reads as 0.
      - alert: RedisMemoryHigh
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.8
            and redis_memory_max_bytes > 0
        for: 10m
        labels:
          severity: warning
          unit: hosting
        annotations:
          summary: "Redis is at {{ $value | humanizePercentage }} of maxmemory"
          description: >-
            With noeviction, Redis refuses every write once it reaches
            maxmemory (REDIS_MAXMEMORY). Look for a key family that grows
            (`redis-cli --bigkeys`) before raising the limit.

  # NIN-1-b1: every approved edge's ranges, re-read at boot and daily by
  # scripts/edge/edge_ranges.py into edge_ranges.prom. The last good copy keeps
  # the edge admitted, but an edge that moved is dropped at its new addresses
  # until a re-read lands. Never recorded is its own alert, on Kubernetes only:
  # dev runs no edge firewall (O8), and only the k3s render scrapes the kubelet.
  - name: hosting.edge-ranges
    rules:
      - alert: EdgeRangesStale
        expr: (time() - txnet_edge_ranges_last_refresh_timestamp_seconds) > 3 * 86400
        for: 1h
        labels:
          severity: warning
          unit: hosting
        annotations:
          summary: "{{ $labels.edge }}'s ranges have not been re-read in 3 days"
          description: >-
            The firewall still admits {{ $labels.edge }} from its last good list,
            taken {{ $value | humanizeDuration }} ago. Run
            `python3 /usr/local/lib/txnet/edge/edge_ranges.py refresh` on
            {{ $labels.instance }}: it prints why the answer was refused (short,
            malformed, too wide, unreachable). A source that moved is a change
            to its row in scripts/edge/edges.json.

      - alert: EdgeRangesNeverRecorded
        expr: |
          absent(txnet_edge_ranges_last_refresh_timestamp_seconds)
            and on() count(up{job="kubelet-cadvisor"}) > 0
        for: 1h
        labels:
          severity: warning
          unit: hosting
        annotations:
          summary: "No edge's ranges have ever been recorded on this cluster"
          description: >-
            edge_ranges.prom is missing from node-exporter's textfile directory:
            the doors' firewall and its refresh were never installed, so the
            origin admits whatever reaches it. On the node, run
            `python3 scripts/edge/edge_firewall.py apply`, then `install`, and
            `python3 scripts/edge/edge_ranges.py install` (hosting O7, O8).

  # A door's origin certificate (NIN-1-c1, hosting O13), read from the Traefik
  # that serves it: no renewal runs, so its end is a date someone must act on.
  - name: hosting.origin-cert
    rules:
      - alert: OriginCertExpiring
        expr: min by (job, cn) (traefik_tls_certs_not_after) - time() < 30 * 86400
        for: 1h
        labels:
          severity: warning
          unit: hosting
        annotations:
          summary: "{{ $labels.job }}'s certificate for {{ $labels.cn }} ends in under 30 days"
          description: >-
            {{ $value | humanizeDuration }} left. Re-issue it with
            `FORCE=1 scripts/edge/origin-cert.sh` and the door's command, seal it
            (`scripts/prod.k8s.sh secrets seal dev-docker/secrets/origin-cert/<door>.pem`
            and its .key), commit, deploy.

      - alert: OriginCertNotServed
        expr: up{job="gateway-domestic"} == 1 unless on(job) traefik_tls_certs_not_after
        for: 1h
        labels:
          severity: warning
          unit: hosting
        annotations:
          summary: "{{ $labels.job }} serves none of our certificates"
          description: >-
            The door answers but loaded no origin certificate, so it presents
            Traefik's default one and OriginCertExpiring watches nothing. Its
            pair is missing or unreadable at /etc/traefik/origin-cert/ (its log
            says which); `scripts/edge/origin-cert.sh show` on the host that
            issued it.
