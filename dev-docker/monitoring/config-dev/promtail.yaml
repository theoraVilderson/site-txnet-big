server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker_txnet
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only collect logs from containers with label txnet.logging=true
      - source_labels: ["__meta_docker_container_label_txnet_logging"]
        regex: "true"
        action: keep

      # Clean container name for display in Grafana
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container_name"

      # Add compose service name as a label
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
