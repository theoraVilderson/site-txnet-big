# =============================================================================
# TXNet — custom Postgres metrics for postgres-exporter (F-067-c)
# =============================================================================
# The four numbers F-067-g set out to watch were queue depth, consumer count,
# dead-letter arrivals and **the age of the oldest unpublished outbox row**.
# The first three read off RabbitMQ's own exporter; this one cannot, because
# it is a fact about a Postgres table, and until F-067-c there was no such
# table and no Postgres scrape target at all.
#
# WHY AN EXPORTER AND NOT A /metrics ON worker-service
#
# ADR-0027 makes worker-service a deployable that serves no requests: no port,
# no Traefik label, no route. Bolting an HTTP surface onto it to expose one
# gauge gives back exactly what that ADR removed. The number is a `SELECT`, the
# database already answers `SELECT`s, and an exporter beside node-exporter and
# cAdvisor is the same shape of thing those already are.
#
# The exporter connects as `txnet_app_user` — the RLS-enforced role, not the
# owner. `automation.outbox_event` has no `tenantId` and therefore no policy,
# so that role reads it whole; giving a monitoring container the superuser to
# count rows would be the wrong trade in the other direction.
# =============================================================================

# billing — coupons past their limit (F-092-ah, ADR-0047 decision 3). A late
# credit claims a use back without a limit check; this is how that is seen.
# `billing.coupons_over_limit()` is SECURITY DEFINER because coupon RLS shows an
# unbound connection only the platform-wide coupons — it answers a count, nothing
# else. Metric: `billing_coupon_over_limit`.
billing_coupon:
  master: true
  cache_seconds: 60
  query: >-
    SELECT billing.coupons_over_limit()::bigint AS over_limit
  metrics:
    - over_limit:
        usage: "GAUGE"
        description: "Coupons whose usedCount is above totalUsageLimit, across every tenant."

automation_outbox:
  # `master: true` — run on the primary only, not on a replica.
  master: true
  cache_seconds: 15
  query: >-
    SELECT
      COALESCE(EXTRACT(EPOCH FROM (now() - MIN("occurredAt"))), 0)::float8
        AS oldest_unpublished_seconds,
      COUNT(*)::bigint AS unpublished_rows,
      COALESCE(MAX("attempts"), 0)::bigint AS max_attempts
    FROM automation.outbox_event
    WHERE "publishedAt" IS NULL
  metrics:
    - oldest_unpublished_seconds:
        usage: "GAUGE"
        description: "Age in seconds of the oldest unpublished automation.outbox_event row. Zero means the outbox is empty."
    - unpublished_rows:
        usage: "GAUGE"
        description: "How many automation.outbox_event rows are waiting for OutboxRelayJob."
    - max_attempts:
        usage: "GAUGE"
        description: "Publish attempts on the most-retried unpublished row. A climbing number is a row the broker keeps refusing."

# =============================================================================
# currency — the FX worker's deviation gate (F-0605)
# =============================================================================
# F-0605 says a move beyond `maxDeviationPercent` is rejected AND raises a
# critical alert. The rejection is `FxRateJob`; this is the alert's half, and
# it comes off Postgres for the same reason the outbox age does — worker-service
# serves no requests (ADR-0027) and there is no app-level `/metrics` anywhere in
# this repo to put a counter on. What the worker does have is a
# `bot_execution_log` row per run, which is a fact about a table.
#
# WHY THE ROW'S `status` IS NOT THE FILTER
#
# An accepted rate polled while one exchange was down is `partial`, not
# `success`: `errorsCount` carries the discards and `TickConsumer.statusOf`
# reads it. So `status` cannot separate "the rate was refused" from "a source
# was down", and those are a critical alert and a warning respectively. The job
# writes `accepted` into `metricsJson` precisely so this query can. Renaming
# that key, or `rejectedDeviationPercent`, disarms the rules in
# `currency.rules.yml` without breaking anything visible.
#
# The window is seven days, not all history: `bot_execution_log` is append-only
# and this runs every 15 seconds. A gate that has not accepted a rate in a week
# has had its alert firing for six days and change.
# =============================================================================

currency_fx:
  master: true
  cache_seconds: 15
  query: >-
    SELECT
      COALESCE(
        EXTRACT(EPOCH FROM (now() - MAX(l."startedAt")
          FILTER (WHERE l."metricsJson"->>'accepted' = 'true'))),
        -1)::float8 AS seconds_since_accepted,
      COUNT(*) FILTER (
        WHERE l."metricsJson"->>'accepted' = 'false'
          AND l."startedAt" > now() - interval '1 hour')::bigint
        AS rejections_1h,
      COALESCE(MAX((l."metricsJson"->>'rejectedDeviationPercent')::float8)
        FILTER (WHERE l."startedAt" > now() - interval '1 hour'), 0)::float8
        AS max_rejected_deviation_percent_1h
    FROM automation.bot_execution_log l
    JOIN automation.bot_worker w ON w.id = l."botWorkerId"
    WHERE w.key = 'fx_rate_refresh'
      AND l."startedAt" > now() - interval '7 days'
  metrics:
    - seconds_since_accepted:
        usage: "GAUGE"
        description: "Age in seconds of the last FX rate the deviation gate accepted. -1 means no accepted rate in the last seven days — including a platform that has never run the worker."
    - rejections_1h:
        usage: "GAUGE"
        description: "How many fx_rate_refresh runs in the last hour were refused by F-0605's deviation gate. Any non-zero value is a critical alert."
    - max_rejected_deviation_percent_1h:
        usage: "GAUGE"
        description: "The largest move, in percent, that the gate refused in the last hour. Zero when nothing was refused."

# =============================================================================
# network — is anything still reading the panels? (F-027-w)
# =============================================================================
# The collector is the only thing that reads a panel's counters, and a stalled
# one has no failure to show for it: `/health` on `network-service` answers 200
# for as long as the process can reach Postgres, which it can while the
# collection loop is wedged on one panel's credential. So the watchdog cannot
# be the service's own health endpoint — it has to be something outside the
# process, reading the mark a completed pass leaves behind
# (`panel.lastSuccessfulCollectionAt`, written by `collect.Loop.stamp`).
#
# That is the same argument the outbox age makes above, one step further: this
# one has to keep answering **while the collector is dead**, which is exactly
# when a `/metrics` on it would be unreachable. A `SELECT` against a database
# nobody has taken down is.
#
# WHAT IS IN SCOPE
#
# The scope and the arithmetic live in `network.collection_watchdog()`
# (migration 20260922000400), not here. It is SECURITY DEFINER for the reason
# `billing_coupon` above is: this connection is `txnet_app_user`, and
# `network.panel`'s policy shows an unbound connection the platform's panels
# and none of a tenant's — so a plain `SELECT` would watch only half of them.
#
# `-1` means no panel in scope has ever been collected: zero seconds is the
# healthiest possible reading and must not be what an empty platform reports.
network_collection:
  master: true
  cache_seconds: 30
  query: >-
    SELECT stalest_panel_seconds, panels_expected, panels_never_collected
    FROM network.collection_watchdog()
  metrics:
    - stalest_panel_seconds:
        usage: "GAUGE"
        description: "Age in seconds of the least recently collected panel's last successful collection pass. -1 means no panel in scope has ever been collected."
    - panels_expected:
        usage: "GAUGE"
        description: "How many panels are accepted and not in maintenance — the population the collector is supposed to be reading."
    - panels_never_collected:
        usage: "GAUGE"
        description: "Accepted panels that have never completed a collection pass. A newly registered panel sits here until its first pass."

# network — the lease planner's learned figures, per panel (F-027-dm, SPEC §10).
# `network.planner_panels()` is SECURITY DEFINER for the watchdog's reason
# above: under RLS this role would see only the platform's panels. Lag is -1
# while a panel has no sample; `tick_known` is 1 once the planner has pinned
# the panel's tick phase (quota.TickClock.Known). The planner's in-process
# counters are on network-service's `/metrics`, not here.
# Metrics: `network_planner_panel_lag_mean_seconds`, `..._lag_stddev_seconds`,
# `..._lag_samples`, `..._tick_known`.
network_planner_panel:
  master: true
  cache_seconds: 60
  query: >-
    SELECT panel, family, lag_mean_seconds, lag_stddev_seconds, lag_samples, tick_known
    FROM network.planner_panels()
  metrics:
    - panel:
        usage: "LABEL"
        description: "Panel id."
    - family:
        usage: "LABEL"
        description: "The panel's driverType."
    - lag_mean_seconds:
        usage: "GAUGE"
        description: "The planner's learned lag mean for the panel, seconds. -1 until the first sample."
    - lag_stddev_seconds:
        usage: "GAUGE"
        description: "The square root of the planner's learned lag variance, seconds. -1 until the first sample."
    - lag_samples:
        usage: "GAUGE"
        description: "Samples behind the panel's learned lag."
    - tick_known:
        usage: "GAUGE"
        description: "1 when the planner has pinned the panel's tick phase, 0 while it has not."

# network — overshoot of the Grants the planner closed, per panel family
# (F-027-dm, SPEC §10). Closed 5 min to 7 days ago; (served − quota at close) /
# quota at close, signed. No row for a family with no close in the window.
# Metrics: `network_planner_overshoot_closed_grants`, `..._ratio_p50`,
# `..._ratio_p95`, `..._ratio_max`.
network_planner_overshoot:
  master: true
  cache_seconds: 300
  query: >-
    SELECT family, closed_grants, overshoot_ratio_p50, overshoot_ratio_p95, overshoot_ratio_max
    FROM network.planner_overshoot()
  metrics:
    - family:
        usage: "LABEL"
        description: "The driverType of the Grant's panels, or `mixed`."
    - closed_grants:
        usage: "GAUGE"
        description: "Grants closed by the planner in the window."
    - overshoot_ratio_p50:
        usage: "GAUGE"
        description: "Median of (served − quota at close) / quota at close. Negative: the close left bytes."
    - overshoot_ratio_p95:
        usage: "GAUGE"
        description: "95th percentile of the same ratio."
    - overshoot_ratio_max:
        usage: "GAUGE"
        description: "Largest overshoot ratio in the window."
