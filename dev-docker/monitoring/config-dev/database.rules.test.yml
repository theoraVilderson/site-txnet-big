# Unit tests for database.rules.yml (OPS-1-d, hosting/contract.md H5). Run:
#   cd dev-docker/monitoring/config-dev && docker run --rm --entrypoint promtool \
#     -v "$PWD:/r:ro" -w /r ${DOCKER_REGISTRY}/prom/prometheus:v2.53.0 \
#     test rules database.rules.test.yml
#
# Each case reads the ALERTS series rather than alert_rule_test, so a reworded
# annotation does not fail a test about when an alert fires.

rule_files:
  - database.rules.yml

evaluation_interval: 1m

tests:
  # The last run failed: pending for 5m, then firing; a later success clears it.
  - interval: 1m
    input_series:
      - series: txnet_pg_backup_last_run_success
        values: "1 1 0x10 1x5"
    promql_expr_test:
      - expr: ALERTS{alertname="PgBackupFailed",alertstate="firing"}
        eval_time: 5m
        exp_samples: []
      - expr: ALERTS{alertname="PgBackupFailed",alertstate="firing"}
        eval_time: 8m
        exp_samples:
          - labels: 'ALERTS{alertname="PgBackupFailed",alertstate="firing",severity="critical",unit="hosting"}'
            value: 1
      - expr: ALERTS{alertname="PgBackupFailed",alertstate="firing"}
        eval_time: 15m
        exp_samples: []

  # The last success is at epoch 0: stale after 36h, firing after 1h more.
  - interval: 1h
    input_series:
      - series: txnet_pg_backup_last_success_timestamp_seconds
        values: "0x40"
    promql_expr_test:
      - expr: ALERTS{alertname="PgBackupStale",alertstate="firing"}
        eval_time: 36h
        exp_samples: []
      - expr: ALERTS{alertname="PgBackupStale",alertstate="firing"}
        eval_time: 38h
        exp_samples:
          - labels: 'ALERTS{alertname="PgBackupStale",alertstate="firing",severity="critical",unit="hosting"}'
            value: 1

  # Never recorded is the loudest case: no pg-backup, no node-exporter file.
  - interval: 1h
    input_series:
      - series: up{job="node-exporter"}
        values: "1x5"
    promql_expr_test:
      - expr: ALERTS{alertstate="firing",unit="hosting"}
        eval_time: 2h
        exp_samples:
          - labels: 'ALERTS{alertname="PgBackupStale",alertstate="firing",severity="critical",unit="hosting"}'
            value: 1
          - labels: 'ALERTS{alertname="PgRestoreDrillStale",alertstate="firing",severity="warning",unit="hosting"}'
            value: 1
          - labels: 'ALERTS{alertname="BackupBundleStale",alertstate="firing",severity="critical",unit="hosting"}'
            value: 1

  # The bundle was made at epoch 0: stale after 26 hours and the hour's wait.
  - interval: 1h
    input_series:
      - series: txnet_backup_bundle_last_success_timestamp_seconds
        values: "0x40"
    promql_expr_test:
      - expr: ALERTS{alertname="BackupBundleStale",alertstate="firing"}
        eval_time: 26h
        exp_samples: []
      - expr: ALERTS{alertname="BackupBundleStale",alertstate="firing"}
        eval_time: 28h
        exp_samples:
          - labels: 'ALERTS{alertname="BackupBundleStale",alertstate="firing",severity="critical",unit="hosting"}'
            value: 1

  # One bundle waiting is the ten minutes before ship.py runs; two for an hour fire.
  # (1m samples: 10m ones would fall outside the 5m lookback between them.)
  - interval: 1m
    input_series:
      - series: txnet_backup_bundle_unshipped
        values: "1x120 2x120"
    promql_expr_test:
      - expr: ALERTS{alertname="BackupBundleNotShipped",alertstate="firing"}
        eval_time: 2h
        exp_samples: []
      - expr: ALERTS{alertname="BackupBundleNotShipped",alertstate="firing"}
        eval_time: 3h20m
        exp_samples:
          - labels: 'ALERTS{alertname="BackupBundleNotShipped",alertstate="firing",severity="warning",unit="hosting"}'
            value: 1

  # The drill passed at epoch 0: stale after 8 days.
  - interval: 1h
    input_series:
      - series: txnet_pg_restore_drill_last_success_timestamp_seconds
        values: "0x200"
    promql_expr_test:
      - expr: ALERTS{alertname="PgRestoreDrillStale",alertstate="firing"}
        eval_time: 192h
        exp_samples: []
      - expr: ALERTS{alertname="PgRestoreDrillStale",alertstate="firing"}
        eval_time: 194h
        exp_samples:
          - labels: 'ALERTS{alertname="PgRestoreDrillStale",alertstate="firing",severity="warning",unit="hosting"}'
            value: 1

  # Every attempt fails (Postgres retries each minute) and nothing archives:
  # firing after 15m of it.
  - interval: 1m
    input_series:
      - series: hosting_wal_archive_failed_count
        values: "0+1x40"
      - series: hosting_wal_archive_last_failed_seconds
        values: "0+60x40"
      - series: hosting_wal_archive_last_archived_seconds
        values: "0x40"
    promql_expr_test:
      - expr: ALERTS{alertname="PgArchiveFailing",alertstate="firing"}
        eval_time: 10m
        exp_samples: []
      - expr: ALERTS{alertname="PgArchiveFailing",alertstate="firing"}
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="PgArchiveFailing",alertstate="firing",severity="critical",unit="hosting"}'
            value: 1

  # A failure that a later segment archived past is not an archive failing.
  - interval: 1m
    input_series:
      - series: hosting_wal_archive_failed_count
        values: "0+1x40"
      - series: hosting_wal_archive_last_failed_seconds
        values: "0+60x40"
      - series: hosting_wal_archive_last_archived_seconds
        values: "30+60x40"
    promql_expr_test:
      - expr: ALERTS{alertname="PgArchiveFailing"}
        eval_time: 20m
        exp_samples: []

  # The data volume's filesystem: 85% used fires, 70% does not.
  - interval: 1m
    input_series:
      - series: txnet_pg_data_fs_size_bytes
        values: "100x30"
      - series: txnet_pg_data_fs_avail_bytes
        values: "30x10 15x20"
    promql_expr_test:
      - expr: ALERTS{alertname="PgWalDiskHigh",alertstate="firing"}
        eval_time: 10m
        exp_samples: []
      - expr: ALERTS{alertname="PgWalDiskHigh",alertstate="firing"}
        eval_time: 25m
        exp_samples:
          - labels: 'ALERTS{alertname="PgWalDiskHigh",alertstate="firing",severity="warning",unit="hosting"}'
            value: 1

  # RabbitMQ's memory alarm: up for 1m fires; cleared, it stops (OPS-1-v, H21).
  - interval: 1m
    input_series:
      - series: rabbitmq_alarms_memory_used_watermark
        values: "0 0 1x10 0x5"
      - series: rabbitmq_alarms_free_disk_space_watermark
        values: "0x17"
    promql_expr_test:
      - expr: ALERTS{alertname="RabbitAlarm",alertstate="firing"}
        eval_time: 2m
        exp_samples: []
      - expr: ALERTS{alertname="RabbitAlarm",alertstate="firing"}
        eval_time: 4m
        exp_samples:
          - labels: 'ALERTS{alertname="RabbitAlarm",alertstate="firing",severity="critical",unit="hosting"}'
            value: 1
      - expr: ALERTS{alertname="RabbitAlarm",alertstate="firing"}
        eval_time: 15m
        exp_samples: []

  # The disk alarm fires the same alert.
  - interval: 1m
    input_series:
      - series: rabbitmq_alarms_memory_used_watermark
        values: "0x10"
      - series: rabbitmq_alarms_free_disk_space_watermark
        values: "0 1x9"
    promql_expr_test:
      - expr: ALERTS{alertname="RabbitAlarm",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: 'ALERTS{alertname="RabbitAlarm",alertstate="firing",severity="critical",unit="hosting"}'
            value: 1

  # One bot-update shard over 500 ready for 5m fires, naming the shard; a shard
  # at 400 and another queue at 900 do not.
  - interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="txnet.automation.bot.update.2"}'
        values: "0 600x10"
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="txnet.automation.bot.update.0"}'
        values: "400x11"
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="txnet.automation.ticks.v2"}'
        values: "900x11"
    promql_expr_test:
      - expr: ALERTS{alertname="BotUpdateBacklog",alertstate="firing"}
        eval_time: 4m
        exp_samples: []
      - expr: ALERTS{alertname="BotUpdateBacklog",alertstate="firing"}
        eval_time: 8m
        exp_samples:
          - labels: 'ALERTS{alertname="BotUpdateBacklog",alertstate="firing",queue="txnet.automation.bot.update.2",severity="critical",unit="hosting"}'
            value: 1

  # Redis at 90% of maxmemory for 10m fires; 50% does not.
  - interval: 1m
    input_series:
      - series: redis_memory_used_bytes
        values: "500x5 900x25"
      - series: redis_memory_max_bytes
        values: "1000x30"
    promql_expr_test:
      - expr: ALERTS{alertname="RedisMemoryHigh",alertstate="firing"}
        eval_time: 15m
        exp_samples: []
      - expr: ALERTS{alertname="RedisMemoryHigh",alertstate="firing"}
        eval_time: 17m
        exp_samples:
          - labels: 'ALERTS{alertname="RedisMemoryHigh",alertstate="firing",severity="warning",unit="hosting"}'
            value: 1

  # No maxmemory (0) is not "infinitely full": used/0 must not fire.
  - interval: 1m
    input_series:
      - series: redis_memory_used_bytes
        values: "900x30"
      - series: redis_memory_max_bytes
        values: "0x30"
    promql_expr_test:
      - expr: ALERTS{alertname="RedisMemoryHigh"}
        eval_time: 25m
        exp_samples: []

  # Arvan last re-read at epoch 0 goes stale after 3 days and the hour's wait;
  # Cloudflare, re-read every minute, never does. (1m samples: with no absent()
  # to bridge them, hourly ones fall outside the 5m lookback and reset `for`.)
  - interval: 1m
    input_series:
      - series: txnet_edge_ranges_last_refresh_timestamp_seconds{edge="arvan"}
        values: "0x4500"
      - series: txnet_edge_ranges_last_refresh_timestamp_seconds{edge="cloudflare"}
        values: "0+60x4500"
    promql_expr_test:
      - expr: ALERTS{alertname="EdgeRangesStale",alertstate="firing"}
        eval_time: 72h
        exp_samples: []
      - expr: ALERTS{alertname="EdgeRangesStale",alertstate="firing"}
        eval_time: 74h
        exp_samples:
          - labels: 'ALERTS{alertname="EdgeRangesStale",alertstate="firing",edge="arvan",severity="warning",unit="hosting"}'
            value: 1

  # On Kubernetes (the kubelet's job exists) an edge list never recorded fires:
  # the cron or the firewall was never installed. Recorded, it does not; on dev
  # (no kubelet job) it never does — the "never recorded" case above holds that.
  - interval: 1m
    input_series:
      - series: up{job="kubelet-cadvisor"}
        values: "1x120"
    promql_expr_test:
      - expr: ALERTS{alertname="EdgeRangesNeverRecorded",alertstate="firing"}
        eval_time: 50m
        exp_samples: []
      - expr: ALERTS{alertname="EdgeRangesNeverRecorded",alertstate="firing"}
        eval_time: 70m
        exp_samples:
          - labels: 'ALERTS{alertname="EdgeRangesNeverRecorded",alertstate="firing",severity="warning",unit="hosting"}'
            value: 1
  - interval: 1m
    input_series:
      - series: up{job="kubelet-cadvisor"}
        values: "1x120"
      - series: txnet_edge_ranges_last_refresh_timestamp_seconds{edge="arvan"}
        values: "0+60x120"
    promql_expr_test:
      - expr: ALERTS{alertname="EdgeRangesNeverRecorded"}
        eval_time: 90m
        exp_samples: []

  # NIN-1-c2 (O13): the certificate 31 days from its end is quiet, and fires
  # an hour after crossing 30. The gateway scraped with none loaded fires (every
  # Cloudflare pull is then refused under Full strict); with one, it does not.
  - interval: 1m
    input_series:
      - series: traefik_tls_certs_not_after{job="gateway-handler",cn="txnet.cyou",sans="*.txnet.cyou,txnet.cyou",serial="1"}
        values: "2678400x1600"
    promql_expr_test:
      - expr: ALERTS{alertname="OriginCertExpiring",alertstate="firing"}
        eval_time: 23h
        exp_samples: []
      - expr: ALERTS{alertname="OriginCertExpiring",alertstate="firing"}
        eval_time: 26h
        exp_samples:
          - labels: 'ALERTS{alertname="OriginCertExpiring",alertstate="firing",cn="txnet.cyou",job="gateway-handler",severity="warning",unit="hosting"}'
            value: 1
  - interval: 1m
    input_series:
      - series: up{job="gateway-handler",instance="gateway-handler:8080"}
        values: "1x120"
    promql_expr_test:
      - expr: ALERTS{alertname="OriginCertNotServed",alertstate="firing"}
        eval_time: 70m
        exp_samples:
          - labels: 'ALERTS{alertname="OriginCertNotServed",alertstate="firing",instance="gateway-handler:8080",job="gateway-handler",severity="warning",unit="hosting"}'
            value: 1
  - interval: 1m
    input_series:
      - series: up{job="gateway-handler",instance="gateway-handler:8080"}
        values: "1x120"
      - series: traefik_tls_certs_not_after{job="gateway-handler",cn="txnet.cyou",sans="*.txnet.cyou,txnet.cyou",serial="1"}
        values: "2108303078x120"
      - series: up{job="node-exporter"}
        values: "1x120"
    promql_expr_test:
      - expr: ALERTS{alertname=~"OriginCert.*"}
        eval_time: 90m
        exp_samples: []
