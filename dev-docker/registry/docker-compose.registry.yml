# =============================================================================
# TXNet — Private Docker Registry Stack
# =============================================================================
# Runs INDEPENDENTLY from the main stack.  The registry service connects to
# the shared `private_backend_network` so the main Traefik can route to it.
# Basic auth is enforced via Traefik middleware.
#
# Usage:
#   docker compose -p txnet-registry -f docker-compose.registry.yml up -d
# =============================================================================

networks:
  private_backend_network:
    external: true
    name: private_backend_network

volumes:
  registry_data:
    name: registry_standalone_data

services:
  # ===========================================================================
  # Docker Registry v2
  # ===========================================================================
  registry:
    image: ${DOCKER_REGISTRY:-docker.arvancloud.ir}/registry:2
    container_name: txnet-registry
    restart: always
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry.rule=Host(`registry.${DOMAIN_NAME:-txnet.local}`)"
      - "traefik.http.routers.registry.entrypoints=websecure"
      - "traefik.http.routers.registry.tls.certresolver=myresolver"
      - "traefik.http.routers.registry.middlewares=registry-auth"
      - "traefik.http.middlewares.registry-auth.basicauth.users=${REGISTRY_AUTH_USER:-admin:$$2y$$10$$P9Z6k8XpK7vQm3WnR5tYuO1aBcDeFgHiJkLmNoPqRsTuVwXyZ0123}"
      - "traefik.http.services.registry.loadbalancer.server.port=5000"
