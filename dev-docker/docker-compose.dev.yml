# =============================================================================
# Dev-only overrides, layered over docker-compose.main.yml by
# `scripts/dev.compose.sh`. Prod runs the main file alone (`scripts/prod.compose.sh`),
# so nothing here reaches it.
# =============================================================================
#
# Every NestJS service (auth, bot, worker, gateway, billing, notification, tenant) runs straight from
# the host checkout: no image is built and no `npm ci` runs in a container.
#
#   - `node_modules` is the host's own (`txnet-backend/node_modules`, bind
#     mounted with the rest of the tree). main.yml mounts no source at all: there
#     it would hide the prod image's own code (OPS-1-o-v). To add or upgrade a
#     package, run npm on the host; the container sees it on its next restart.
#   - The image is stock Node 24 on Debian (glibc) because that is what the host
#     is: the host's native modules — the Prisma engine
#     (`debian-openssl-3.0.x`), `@swc/core-linux-x64-gnu`, `@nx/nx-linux-x64-gnu`
#     — do not load on Alpine (musl) or on Node 20. The `-slim` variant has no
#     OpenSSL, which Prisma needs.
#   - `scripts/dev-serve.js` keeps one webpack watch alive and restarts the app
#     on every save, so a code change needs neither a rebuild nor a restart. A
#     schema change needs `npx prisma generate` on the host, then a restart.
#   - `volumes: !override` replaces main.yml's list whole, so any other mount a
#     service needs (the vault KEK) is repeated here, or the service loses it.
#   - `build: !reset null` is written **in each service**, never in the anchor
#     below: a YAML merge key (`<<:`) drops compose's `!reset` tag, and the
#     service then silently builds its image — `npm ci` included — again.

#   - Every dev container has a memory ceiling (2026-10-06); its rotated logs
#     come from main.yml (compose/logging.yml, H11).
#     With none, one runaway container (a `next dev` cache, or the flood tool
#     planted through coinsite's RCE on 2026-09-25) filled all 16 GB and took
#     the host down every ~2 days — the live site and bot on it included. A
#     container that hits its ceiling is OOM-killed and restarted alone.

x-host-node: &host-node
  # Exact patch: with pull_policy: missing a floating tag is never re-pulled, so a
  # Node security fix (2026-10-21) never arrived. Bump with the host's nvm Node.
  image: ${DOCKER_REGISTRY}/node:24.22.1-bookworm
  pull_policy: missing
  working_dir: /app
  command: ["node", "scripts/dev-serve.js"]
  mem_limit: ${DEV_NEST_MEM_LIMIT:-1g}

services:
  auth-service:
    <<: *host-node
    build: !reset null
    environment:
      - APP_NAME=auth-service
    volumes: !override
      - ../txnet-backend:/app:delegated
      - locale_cache:/var/cache/txnet-locale  # H17, as main.yml mounts it
      # The vault's KEK (ADR-0039): without it auth-service refuses to boot.
      - ./secrets/vault-kek:/run/secrets/vault-kek:ro

  bot-service:
    <<: *host-node
    build: !reset null
    environment:
      - APP_NAME=bot-service
    volumes: !override
      - ../txnet-backend:/app:delegated
      - locale_cache:/var/cache/txnet-locale  # H17, as main.yml mounts it

  worker-service:
    <<: *host-node
    build: !reset null
    environment:
      - APP_NAME=worker-service
    volumes: !override
      - ../txnet-backend:/app:delegated

  metering-service:
    <<: *host-node
    build: !reset null
    environment:
      - APP_NAME=metering-service
    volumes: !override
      - ../txnet-backend:/app:delegated

  ai-service:
    <<: *host-node
    build: !reset null
    # Its own ceiling from ai-service.yml, not the Nest default above.
    mem_limit: ${AI_SERVICE_MEM_LIMIT:-512m}
    environment:
      - APP_NAME=ai-service
    volumes: !override
      - ../txnet-backend:/app:delegated
      - locale_cache:/var/cache/txnet-locale  # H17, as main.yml mounts it

  gateway-service:
    <<: *host-node
    build: !reset null
    environment:
      - APP_NAME=gateway-service
    volumes: !override
      - ../txnet-backend:/app:delegated

  notification-service:
    <<: *host-node
    build: !reset null
    environment:
      - APP_NAME=notification-service
    volumes: !override
      - ../txnet-backend:/app:delegated
      - locale_cache:/var/cache/txnet-locale  # H17, as main.yml mounts it
      # Repeated for billing's reason: the campaign SMS line is read from the
      # vault (F-018-a), and `!override` drops main.yml's KEK mount.
      - ./secrets/vault-kek:/run/secrets/vault-kek:ro

  tenant-service:
    <<: *host-node
    build: !reset null
    environment:
      - APP_NAME=tenant-service
    volumes: !override
      - ../txnet-backend:/app:delegated
      - locale_cache:/var/cache/txnet-locale  # H17, as main.yml mounts it
      # `!override` replaces main.yml's list, so the object-storage volume it
      # mounts must be repeated here, or uploads land in the container (F-018-m).
      - object_storage:/data/objects
      # And the vault KEK, for the vault's internal seams (F-018-ab).
      - ./secrets/vault-kek:/run/secrets/vault-kek:ro

  currency-service:
    <<: *host-node
    build: !reset null
    environment:
      - APP_NAME=currency-service
    volumes: !override
      - ../txnet-backend:/app:delegated
      - locale_cache:/var/cache/txnet-locale  # H17, as main.yml mounts it

  support-service:
    <<: *host-node
    build: !reset null
    environment:
      - APP_NAME=support-service
    volumes: !override
      - ../txnet-backend:/app:delegated
      - locale_cache:/var/cache/txnet-locale  # H17, as main.yml mounts it
      # `!override` drops main.yml's list: attachments' volume, repeated (F-033-f).
      - object_storage:/data/objects

  billing-service:
    <<: *host-node
    build: !reset null
    environment:
      - APP_NAME=billing-service
    volumes: !override
      - ../txnet-backend:/app:delegated
      - locale_cache:/var/cache/txnet-locale  # H17, as main.yml mounts it
      # `!override` replaces main.yml's list, so the vault KEK it mounts must be
      # repeated here — without it the service refuses to boot (ADR-0039).
      - ./secrets/vault-kek:/run/secrets/vault-kek:ro
      # And the object-storage volume, or transfer receipts land in the container (F-805-a).
      - object_storage:/data/objects

  # ---- Memory ceilings for the services not run from the host checkout ----
  # Sized at ~2-3x what each uses at rest (docker stats, 2026-10-06). The
  # source trees the Next apps and the Go services (air) run from are mounted
  # here, never in main.yml: there they would hide the prod image's own code (OPS-1-o-v).
  site-pwa:
    mem_limit: ${DEV_SITE_PWA_MEM_LIMIT:-3g} # `next dev --turbopack` grows with every edit
    # No swap: at the limit the container is killed and restarts in ~30 s.
    # With swap it paged instead and served requests in minutes (2026-10-07:
    # 3 GB after ~14 h and 1,188 requests — the dev server's own growth, not load).
    memswap_limit: ${DEV_SITE_PWA_MEM_LIMIT:-3g}
    environment:
      # Caps the JS heap below the container, so V8 collects harder and exits
      # cleanly when it cannot; Turbopack's native memory is outside it.
      - NODE_OPTIONS=--max-old-space-size=1536
    volumes:
      - ../site-pwa:/app:delegated
      - ../site-pwa/node_modules:/app/node_modules
      - ../site-pwa/.next:/app/.next
  coinsite:
    mem_limit: ${DEV_COINSITE_MEM_LIMIT:-1536m}
    volumes:
      - ../coinsite:/app:delegated
      - /app/node_modules # anonymous vol: keep the image's node_modules
  main-db:
    mem_limit: 2g
  memory-data:
    mem_limit: 1g
  rabbitmq:
    mem_limit: 1g
  mailpit:
    mem_limit: 256m
  translator:
    mem_limit: 1536m
  translator-llm:
    mem_limit: ${DEV_TRANSLATOR_LLM_MEM_LIMIT:-3g} # ollama; its model is ~2 GB
  locale-service:
    mem_limit: 256m
  gateway-handler:
    mem_limit: 512m
  authorization-handler:
    mem_limit: 512m
    volumes:
      - ../auth-handler:/src/auth-handler
      - ../i18n-platform/clients/go:/src/i18n-platform/clients/go:ro
  network-service:
    mem_limit: 512m
    volumes:
      - ../network-service:/src
  sub-service:
    mem_limit: 512m
    volumes:
      - ../sub-service:/src
  guide-media:
    mem_limit: 256m
  object-backup:
    mem_limit: 512m
  pg-backup:
    mem_limit: 512m

  # A real RouterOS v7 with User Manager (F-1601-e, ADR-0160 decision 9): the
  # router the usermanager driver's wire shapes are proved on. Dev only and
  # behind a profile, so `up` never starts it:
  #   scripts/dev.compose.sh --profile routeros up -d --build routeros-chr
  # qemu emulates with no /dev/kvm, so it is held to one core. Its REST root
  # is http://routeros-chr (admin / CHR_ADMIN_PASSWORD); probes in
  # dev-docker/routeros/README.md.
  routeros-chr:
    profiles: ["routeros"]
    build:
      context: ./routeros
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
        APK_MIRROR: ${APK_MIRROR:-}
        ROUTEROS_VERSION: ${ROUTEROS_VERSION:-7.24.5}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: ${STACK_NAME:-txnet}-routeros-chr
    restart: "no"
    environment:
      - CHR_ADMIN_PASSWORD=${CHR_ADMIN_PASSWORD:-txnet-dev-chr}
      - CHR_RADIUS_SECRET=${CHR_RADIUS_SECRET:-txnet-dev-radius}
    # The NAS probe dials the guest's OpenVPN server from this container.
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes:
      - routeros_chr_data:/data
    cpus: 1
    mem_limit: 512m
    networks:
      - private_backend_network

  # IBSng A1.24, the last open-source release (F-027-ay-a, ADR-0160 decision
  # 5): the install the ibsng driver's wire shapes are proved on. Dev only and
  # behind a profile, so `up` never starts it:
  #   scripts/dev.compose.sh --profile ibsng up -d --build ibsng
  # XML-RPC at http://ibsng:1235 (system / IBSNG_SYSTEM_PASSWORD); its own
  # Postgres, never main-db. Probes in dev-docker/ibsng/README.md.
  ibsng-db:
    profiles: ["ibsng"]
    image: ${DOCKER_REGISTRY}/postgres:18-alpine
    container_name: ${STACK_NAME:-txnet}-ibsng-db
    restart: "no"
    environment:
      - POSTGRES_DB=IBSng
      - POSTGRES_USER=ibs
      - POSTGRES_PASSWORD=${IBSNG_DB_PASSWORD:-ibsdbpass}
    volumes:
      - ibsng_db_data:/var/lib/postgresql
    cpus: 1
    mem_limit: 256m
    networks:
      - private_backend_network
  ibsng:
    profiles: ["ibsng"]
    build:
      context: ./ibsng
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: ${STACK_NAME:-txnet}-ibsng
    restart: "no"
    depends_on: [ibsng-db]
    environment:
      - IBSNG_DB_PASSWORD=${IBSNG_DB_PASSWORD:-ibsdbpass}
      - IBSNG_SYSTEM_PASSWORD=${IBSNG_SYSTEM_PASSWORD:-txnet-dev-ibsng}
    cpus: 1
    mem_limit: 256m
    networks:
      - private_backend_network

volumes:
  routeros_chr_data:
  ibsng_db_data:
