# =============================================================================
# TXNet — Main Application Stack (Local Dev)
# =============================================================================
# Contains: Traefik, Go Auth Handler, NestJS Backends, Next.js Frontends,
#           Redis, PostgreSQL, RabbitMQ
#
# Usage:
#   docker compose -p txnet-main -f docker-compose.main.yml up -d --build
# =============================================================================

networks:
  public_gateway_network:
    name: ${PUBLIC_NET_NAME:-public_gateway_network}

  private_backend_network:
    name: ${PRIVATE_NET_NAME:-private_backend_network}
    driver: bridge
    # No fixed subnet: let Docker pick a free pool. Pinning a /16 makes a
    # second stack (or a leftover network) fail with "Pool overlaps".
    # To pin one anyway, add:  ipam: { config: [{ subnet: 10.x.0.0/16 }] }

volumes:
  redis_vol_internal:
  postgres_data:
  rabbitmq_data:
  translator_models:
  translator_llm_models:
  locales_runtime:

services:
  # ===========================================================================
  # Traefik v3.7 — Reverse Proxy & TLS Termination
  # ===========================================================================
  gateway-handler:
    image: ${DOCKER_REGISTRY}/traefik:v3.7
    container_name: ${STACK_NAME:-txnet}-gateway
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${PRIVATE_NET_NAME:-private_backend_network}"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt — HTTP challenge (production)
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${EMAIL_SSL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "${HTTP_ENTRANCE_PORT:-80}:80"
      - "${HTTPS_ENTRANCE_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../dev_letsencrypt:/letsencrypt
    networks:
      public_gateway_network:
      private_backend_network:
        # The API host, answered in-network (F-306-a): bot-service reaches the
        # panel's billing routes through this gate, as `api.<domain>` so the
        # router rules match, without leaving the private network.
        aliases:
          - api.${DOMAIN_NAME}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard-http.rule=Host(`monitor.${DOMAIN_NAME}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard-http.entrypoints=web"
      - "traefik.http.routers.dashboard-http.service=api@internal"
      - "traefik.http.routers.dashboard-http.middlewares=auth-dashboard"
      - "traefik.http.routers.dashboard-https.rule=Host(`monitor.${DOMAIN_NAME}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard-https.entrypoints=websecure"
      - "traefik.http.routers.dashboard-https.tls.certresolver=myresolver"
      - "traefik.http.routers.dashboard-https.service=api@internal"
      - "traefik.http.routers.dashboard-https.middlewares=auth-dashboard"
      - "traefik.http.middlewares.auth-dashboard.basicauth.users=${TRAEFIK_PANEL_USERNAME}:${TRAEFIK_PANEL_PASSWORD}"
      - "txnet.logging=true"

  # ===========================================================================
  # locale-service — i18n source of truth (gRPC). Every backend/frontend
  # service preloads a scope from here on boot and keeps it live via Watch.
  # ===========================================================================
  locale-service:
    build:
      context: ../i18n-platform/services/locale-service
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-txnet}-locale-service
    restart: unless-stopped
    volumes:
      - ../locales:/locales:ro
      # Runtime-written text (catalog names, drafts) — state, back it up like
      # the database (ADR-0050).
      - locales_runtime:/locales-runtime
    environment:
      - GRPC_ADDR=:${LOCALE_SERVICE_HOST_PORT:-50051}
      - LOCALES_DIR=/locales
      - LOCALES_RUNTIME_DIR=/locales-runtime
    healthcheck:
      test: ["CMD", "/usr/local/bin/locale-service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    networks:
      - private_backend_network
    labels:
      - "txnet.logging=true"

  # ===========================================================================
  # translator — self-hosted LibreTranslate (Argos models). Drafts catalog text
  # for every language an admin did not write; a human publishes it (ADR-0050).
  # Private network only; models download once into the volume. Which models
  # load is deployment data (TRANSLATOR_LANGUAGES), never code (§1.1): add a
  # language's code there when the language is added to locales/.
  # ===========================================================================
  translator:
    image: ${DOCKER_REGISTRY}/libretranslate/libretranslate:v1.6.2
    container_name: ${STACK_NAME:-txnet}-translator
    restart: unless-stopped
    volumes:
      - translator_models:/home/libretranslate/.local
    environment:
      - LT_LOAD_ONLY=${TRANSLATOR_LANGUAGES:-en,fa}
      - LT_UPDATE_MODELS=true
      - LT_DISABLE_WEB_UI=true
      - LT_THREADS=${TRANSLATOR_THREADS:-2}
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      start_period: 600s
      retries: 5
    networks:
      - private_backend_network
    labels:
      - "txnet.logging=true"

  # ===========================================================================
  # translator-llm — a local LLM (Ollama) that drafts catalog text before
  # LibreTranslate is asked (ADR-0050 amendment 3). Free and offline: the model
  # is pulled once into the volume (on first start, if missing) and nothing
  # leaves the deployment after that. qwen2.5:3b is ~2 GB on disk and needs
  # ~3-4 GB RAM; no GPU required. No route to ollama.com (offline, national
  # internet): download the GGUF anywhere and run scripts/translator-llm-import.sh.
  # ===========================================================================
  translator-llm:
    image: ${DOCKER_REGISTRY}/ollama/ollama:0.6.8
    container_name: ${STACK_NAME:-txnet}-translator-llm
    restart: unless-stopped
    volumes:
      - translator_llm_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${TRANSLATOR_LLM_KEEP_ALIVE:-30m}
      - TRANSLATOR_LLM_MODEL=${TRANSLATOR_LLM_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama serve & pid=$$!;
        sleep 5;
        ollama show "$$TRANSLATOR_LLM_MODEL" >/dev/null 2>&1 || ollama pull "$$TRANSLATOR_LLM_MODEL" || echo "model pull failed: drafts fall back to LibreTranslate";
        wait $$pid
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - private_backend_network
    labels:
      - "txnet.logging=true"

  # ===========================================================================
  # Go Authorization Handler — Traefik ForwardAuth Middleware
  # ===========================================================================
  authorization-handler:
    build:
      context: .. # repo root — shared Go module lives here
      dockerfile: auth-handler/Dockerfile
      target: ${ENVIRONMENT}
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-auth-handler
    restart: unless-stopped
    working_dir: /src/auth-handler
    volumes:
      - ../auth-handler:/src/auth-handler
      - ../i18n-platform/clients/go:/src/i18n-platform/clients/go:ro
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT}
      - JWT_SECRET=${JWT_ACCESS_SECRET}
      - REDIS_URL=${REDIS_URL}
      - REDIS_KEY_NAMESPACE=${REDIS_KEY_NAMESPACE:-txnet:auth}
      - REDIS_KEYSPACE_VERSION=${REDIS_KEYSPACE_VERSION:-v2}
      - PERMISSIONS_FILE_PATH=/src/auth-handler/configs/permissions.yaml
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      - LOCALE_SERVICE_ADDR=locale-service:${LOCALE_SERVICE_HOST_PORT:-50051}
      - LOCALE_SCOPE=backend
      # Browser origins that may read a refusal (401/403/500) from this gate.
      # Traefik returns it to the client as-is, so the service's own CORS never
      # runs on it; without this an expired token reads as a CORS error.
      - CORS_ALLOWED_ORIGINS=https://panel.${DOMAIN_NAME}
      # How long the boot blocks for the first snapshots (F-086). It was
      # hardcoded twice at two different values; the gateway waits longer than
      # the shared client's default because it cannot retry — it blocks its own
      # start, and coming up without translations means serving raw message
      # keys to every user.
      - LOCALE_BOOT_TIMEOUT=${LOCALE_BOOT_TIMEOUT:-60s}
    depends_on:
      locale-service:
        condition: service_healthy
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      # ForwardAuth middleware — validates every request that uses it
      - "traefik.http.middlewares.my-auth.forwardauth.address=http://authorization-handler:${INTERAL_BACKEND_PORT:-8080}/validate"
      # Strip fake headers from incoming requests (security)
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-User-Id="
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-Actor-Id="
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-User-Permissions="
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-Tenant-Id="
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-Role-Id="
      # The impersonation pair. Forwarded since the feature shipped and never
      # stripped, which `tools/contracts.py` found on its first run (F-072).
      # `my-auth` happens to cover it — Traefik deletes every header in
      # `authResponseHeaders` from the request before copying the auth
      # response onto it — but that is a property of one middleware, not a
      # boundary: a router carrying `strip-fake-headers` without a ForwardAuth
      # would pass a client-set `X-Impersonated: true` straight through, and
      # downstream reads it as an audit fact about who is acting.
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-Impersonated="
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-Impersonated-By="
      # F-067-h. `gateway-service` re-checks `session:<id>` on a timer, because
      # a WebSocket outlives by hours the access token that opened it. It is
      # stripped here for the same reason as every header above: downstream
      # trusts it, so a client must not be able to set it.
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-Session-Id="
      # ADR-0031. Set by the optional gate on a 2xx that identified nobody, so
      # `gateway-service` can tell an anonymous caller from a router that lost
      # its middleware. Stripped here because downstream reads it as evidence
      # that the gate ran.
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-Auth-Anonymous="
      # F-104-q. The messenger whose chat a session was minted in; billing
      # offers an in-chat gateway on it, so a browser must not be able to claim it.
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-Chat-Platform="
      - "traefik.http.middlewares.my-auth.forwardauth.authResponseHeaders=X-User-Id,X-Tenant-Id,X-Role-Id,X-User-Permissions,X-Impersonated,X-Impersonated-By,X-Session-Id,X-Chat-Platform"

      # The optional gate (ADR-0031): the same decision as `my-auth` for a
      # caller that brought a credential, and a 200 identifying nobody for one
      # that did not. The realtime router uses it, because a WebSocket here is
      # opened before anyone signs in — the OTP delivery result is pushed onto
      # one during registration (F-067-j).
      #
      # It is a second middleware rather than a flag on the first because
      # ForwardAuth's address is what chooses the behaviour, and a router picks
      # a middleware by name. Every other router keeps `my-auth` and is
      # unaffected.
      - "traefik.http.middlewares.my-auth-optional.forwardauth.address=http://authorization-handler:${INTERAL_BACKEND_PORT:-8080}/validate-optional"
      - "traefik.http.middlewares.my-auth-optional.forwardauth.authResponseHeaders=X-User-Id,X-Tenant-Id,X-Role-Id,X-User-Permissions,X-Impersonated,X-Impersonated-By,X-Session-Id,X-Chat-Platform,X-Auth-Anonymous"

      - "txnet.logging=true"

  # ===========================================================================
  # NestJS Auth Service (Nx Monorepo)
  # ===========================================================================
  auth-service:
    build:
      context: ../txnet-backend
      dockerfile: Dockerfile
      target: ${ENVIRONMENT}
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        - APP_NAME=auth-service
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-auth-service
    restart: unless-stopped
    volumes:
      - ../txnet-backend:/app:delegated
      - /app/node_modules
      # The Credential Vault's KEK (ADR-0026). Mounted as a file, read-only,
      # because it must never be an environment variable — an env var is
      # readable from `docker inspect` and from every child process. In Swarm
      # this is a real `secrets:` entry landing at the same path; here it is a
      # bind mount so the dev stack needs no swarm mode. `:ro` and the leading
      # `./secrets/` are both deliberate: nothing in the app writes it.
      - ./secrets/vault-kek:/run/secrets/vault-kek:ro
    environment:
      - PORT=${AUTH_PORT}
      - NODE_ENV=${NODE_ENV:-development}
      # The owner connection. Prisma's CLI reads it by name; the running
      # service does not use it — it owns every table, and Row-Level
      # Security does not apply to a table's owner (F-066-m-a).
      - DATABASE_URL=postgresql://${MAIN_DB_USERNAME}:${MAIN_DB_PASSWORD}@main-db:${MAIN_DB_PORT:-5432}/${MAIN_DB_NAME}
      # What the service actually connects with: a login role that owns
      # nothing and carries NOBYPASSRLS, so the policies bind. Created by
      # `./scripts/db-login-roles.sh`, which is a manual step on an
      # existing database — the service refuses to boot without it.
      - DATABASE_APP_URL=postgresql://txnet_app_user:${DB_APP_PASSWORD}@main-db:${MAIN_DB_PORT:-5432}/${MAIN_DB_NAME}
      # The second pool (F-066-m-b). Same database, different role: its policy
      # is `USING (true)`, so it answers the reads that resolve a tenant and
      # therefore cannot run inside one. A policy, not a bypass — this role
      # carries NOBYPASSRLS too.
      - DATABASE_CROSS_TENANT_URL=postgresql://txnet_cross_tenant_user:${DB_CROSS_TENANT_PASSWORD}@main-db:${MAIN_DB_PORT:-5432}/${MAIN_DB_NAME}
      - REDIS_URL=${REDIS_URL}
      - REDIS_KEY_NAMESPACE=${REDIS_KEY_NAMESPACE:-txnet:auth}
      - REDIS_KEYSPACE_VERSION=${REDIS_KEYSPACE_VERSION:-v2}
      # The one message this process publishes: an `admin_manual` tick from
      # `POST /api/auth/workers/:key/run` (F-031-b). Optional by design — the
      # connection is opened on first use, so an environment without a broker
      # boots and serves logins, and only that route answers 503.
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      - AUTOMATION_EXCHANGE=${AUTOMATION_EXCHANGE:-txnet.automation}  # default declared in shared-core/src/lib/automation/bot-update.ts (F-079)
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_HASH_SECRET=${JWT_REFRESH_HASH_SECRET}
      - JWT_ACCESS_TTL_SEC=${JWT_ACCESS_TTL_SEC:-900}
      - OTP_TOKEN_TTL_SEC=${OTP_TOKEN_TTL_SEC:-300}
      - RESET_TOKEN_TTL_SEC=${RESET_TOKEN_TTL_SEC:-300}
      # Abuse limits. Defaults are what the code shipped with; a deployment
      # with a different risk appetite moves them without a rebuild.
      - LOGIN_FAILURE_LOCK_THRESHOLD=${LOGIN_FAILURE_LOCK_THRESHOLD:-10}
      # Per-route request limits (F-087). Forwarded empty when unset: the
      # default for each lives once, in auth-service's env schema, so it is not
      # repeated here where it could disagree.
      - LOGIN_PWD_RATE_LIMIT=${LOGIN_PWD_RATE_LIMIT:-}
      - LOGIN_OTP_REQUEST_RATE_LIMIT=${LOGIN_OTP_REQUEST_RATE_LIMIT:-}
      - LOGIN_OTP_VERIFY_RATE_LIMIT=${LOGIN_OTP_VERIFY_RATE_LIMIT:-}
      - REGISTER_RATE_LIMIT=${REGISTER_RATE_LIMIT:-}
      - REGISTER_VERIFY_RATE_LIMIT=${REGISTER_VERIFY_RATE_LIMIT:-}
      - PASSWORD_FORGOT_RATE_LIMIT=${PASSWORD_FORGOT_RATE_LIMIT:-}
      - FORGOT_VERIFY_RATE_LIMIT=${FORGOT_VERIFY_RATE_LIMIT:-}
      - OTP_DELIVERY_STATUS_RATE_LIMIT=${OTP_DELIVERY_STATUS_RATE_LIMIT:-}
      - OTP_CHANNELS_RATE_LIMIT=${OTP_CHANNELS_RATE_LIMIT:-}
      - CAPTCHA_RATE_LIMIT=${CAPTCHA_RATE_LIMIT:-}
      - BOT_LINK_RESOLVE_RATE_LIMIT=${BOT_LINK_RESOLVE_RATE_LIMIT:-}
      - BOT_LINK_CONTACT_RATE_LIMIT=${BOT_LINK_CONTACT_RATE_LIMIT:-}
      - BOT_LINK_STATUS_RATE_LIMIT=${BOT_LINK_STATUS_RATE_LIMIT:-}
      - BOT_SESSION_RATE_LIMIT=${BOT_SESSION_RATE_LIMIT:-}
      - BOT_WEBAPP_SESSION_RATE_LIMIT=${BOT_WEBAPP_SESSION_RATE_LIMIT:-}
      - ACCOUNTS_ADD_OTP_REQUEST_RATE_LIMIT=${ACCOUNTS_ADD_OTP_REQUEST_RATE_LIMIT:-}
      - ACCOUNTS_ADD_OTP_VERIFY_RATE_LIMIT=${ACCOUNTS_ADD_OTP_VERIFY_RATE_LIMIT:-}
      - ACCOUNTS_ADD_PASSWORD_RATE_LIMIT=${ACCOUNTS_ADD_PASSWORD_RATE_LIMIT:-}
      - ACCOUNTS_LIST_RATE_LIMIT=${ACCOUNTS_LIST_RATE_LIMIT:-}
      - ACCOUNTS_SWITCH_RATE_LIMIT=${ACCOUNTS_SWITCH_RATE_LIMIT:-}
      - ACCOUNTS_REMOVE_RATE_LIMIT=${ACCOUNTS_REMOVE_RATE_LIMIT:-}
      # The platform-wide ceiling over every guarded route, as a multiple of
      # that route's own per-tenant limit (F-066-s). 0 switches it off.
      - PLATFORM_RATE_LIMIT_FACTOR=${PLATFORM_RATE_LIMIT_FACTOR:-10}
      - OTP_DELIVERY_MODE=${OTP_DELIVERY_MODE:-console}
      # Which delivery methods this environment offers. Drop one from the list
      # and it disappears from GET /api/auth/otp/channels as well.
      - OTP_ALLOWED_CHANNELS=${OTP_ALLOWED_CHANNELS:-sms}
      - OTP_DEV_CONSOLE_LOG=${OTP_DEV_CONSOLE_LOG:-false}
      - BOT_LINK_TOKEN_TTL_SEC=${BOT_LINK_TOKEN_TTL_SEC:-900}
      # Telegram / Bale, as platforms: the API host and the deep-link host,
      # which are the same whoever the bot belongs to. Every bot's token,
      # username and webhook secret is its tenant's, and lives on that tenant's
      # BotIntegration row and in the Credential Vault (F-066-i).
      - TELEGRAM_API_BASE=${TELEGRAM_API_BASE:-https://api.telegram.org}
      - TELEGRAM_DEEP_LINK_BASE=${TELEGRAM_DEEP_LINK_BASE:-https://t.me}
      - BALE_API_BASE=${BALE_API_BASE:-https://tapi.bale.ai}
      - BALE_DEEP_LINK_BASE=${BALE_DEEP_LINK_BASE:-https://ble.ir}
      # The webhook belongs to bot-service (ADR-0011); the deprecated route
      # this service kept for one release is gone with F-066-i.
      # Shared secret bot-service presents as X-Service-Token: it waives the
      # captcha and re-buckets the rate limit, and authenticates no user.
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN:-}
      - SMS_API_URL=${SMS_API_URL:-}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_SENDER=${SMS_SENDER_PRIVATE:-}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - FRONTEND_ORIGIN=https://panel.${DOMAIN_NAME}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - TRUST_PROXY=${TRUST_PROXY}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      # No DEFAULT_TENANT_SLUG: there is no fallback tenant (ADR-0025). A Host
      # that matches no tenant_domain row is answered a neutral 404, so the dev
      # stack depends on `node prisma/seed.js` having created the row for
      # api.${DOMAIN_NAME} — see .env.example.
      # Phone numbers are every country by default (ADR-0018). The region a
      # number typed without `+` belongs to follows DEFAULT_LANGUAGE unless
      # DEFAULT_PHONE_COUNTRY overrides it.
      - DEFAULT_PHONE_COUNTRY=${DEFAULT_PHONE_COUNTRY:-}
      - SUPPORTED_PHONE_COUNTRIES=${SUPPORTED_PHONE_COUNTRIES:-}
      - LOCALE_SERVICE_ADDR=locale-service:${LOCALE_SERVICE_HOST_PORT:-50051}
      - LOCALE_SCOPE=backend
      # A PATH to the mounted secret above, never the key itself (ADR-0026).
      # Unset it and the service still boots, refusing every credential
      # operation — nothing writes a tenant credential until F-066-i.
      - VAULT_KEK_FILE=${VAULT_KEK_FILE:-/run/secrets/vault-kek}
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      # CORS is handled inside the app (app.enableCors, FRONTEND_ORIGIN) —
      # do not also apply a Traefik-level CORS headers middleware here. A
      # second layer duplicates Access-Control-Allow-* on the same response,
      # which browsers reject, so the preflight/POST for login+register
      # never lands and refresh_token never gets set client-side.
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.period=1m"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.burst=50"
      - "traefik.http.services.auth-service.loadbalancer.server.port=${AUTH_PORT}"

        # http router for auth-service (with TLS)

      - "traefik.http.routers.auth-service-http.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/auth`)"
      # - "traefik.http.routers.auth-service-http.rule=Host(`api.${DOMAIN_NAME}`)"
      - "traefik.http.routers.auth-service-http.entrypoints=web"
      - "traefik.http.routers.auth-service-http.middlewares=auth-rate-limit"
      - "traefik.http.routers.auth-service-http.service=auth-service"

      # https router for auth-service (with TLS)
      - "traefik.http.routers.auth-service-https.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth-service-https.entrypoints=websecure"
      - "traefik.http.routers.auth-service-https.tls.certresolver=myresolver"
      - "traefik.http.routers.auth-service-https.middlewares=auth-rate-limit"

      - "traefik.http.routers.auth-service-https.service=auth-service"
      - "txnet.logging=true"
    depends_on:
      main-db:
        condition: service_healthy
      locale-service:
        condition: service_healthy

  # ===========================================================================
  # NestJS Bot Service (Nx Monorepo) — the Telegram/Bale surface
  # ---------------------------------------------------------------------------
  # It holds no database credentials and no JWT secret on purpose: every
  # decision comes from auth-service over HTTP, exactly as the panel's does
  # (ADR-0009). What it owns is the inbound webhook — one unguessable path per
  # bot — and the conversation state in Redis.
  # ===========================================================================
  bot-service:
    build:
      context: ../txnet-backend
      dockerfile: Dockerfile
      target: ${ENVIRONMENT}
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        - APP_NAME=bot-service
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-bot-service
    restart: unless-stopped
    volumes:
      - ../txnet-backend:/app:delegated
      - /app/node_modules
    environment:
      - PORT=${BOT_PORT:-3000}
      - NODE_ENV=${NODE_ENV:-development}
      - REDIS_URL=${REDIS_URL}
      # Same namespace and version as auth-service: one bump abandons every
      # key this platform holds, bot sessions included (ADR-0005).
      - REDIS_KEY_NAMESPACE=${REDIS_KEY_NAMESPACE:-txnet:auth}
      - REDIS_KEYSPACE_VERSION=${REDIS_KEYSPACE_VERSION:-v2}
      # In-network, so bot traffic never leaves the private network to reach
      # the API it depends on.
      - AUTH_API_BASE_URL=http://auth-service:${AUTH_PORT}
      # Billing through the gate, never billing-service directly (F-306-a): its
      # routes trust only what `my-auth` writes. The chat's access token is the
      # Bearer; Traefik's network alias keeps it in-network.
      - BILLING_API_BASE_URL=http://api.${DOMAIN_NAME}
      # A bot chat has no host to resolve a tenant from, and there is no
      # fallback tenant (ADR-0025). Since F-066-i an update names its own
      # tenant — the one its webhook path resolved to — so this is only the
      # fallback for calls that are not answering an update. `prisma/seed.js`
      # prints the id it created.
      - BOT_TENANT_ID=${BOT_TENANT_ID:-}
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN:-}
      # The webhook verifies and enqueues; worker-service runs the flow and
      # calls back in (F-067-b). Required here, unlike in auth-service: this
      # service's only route is the one that publishes.
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      - AUTOMATION_EXCHANGE=${AUTOMATION_EXCHANGE:-txnet.automation}  # default declared in shared-core/src/lib/automation/bot-update.ts (F-079)
      # Must equal worker-service's BOT_UPDATE_QUEUES: this side hashes a chat
      # into a routing key, that side declares the queues bound to it (D-16).
      - BOT_UPDATE_QUEUES=${BOT_UPDATE_QUEUES:-4}
      - AUTOMATION_PUBLISH_CONFIRM_MS=${AUTOMATION_PUBLISH_CONFIRM_MS:-5000}
      - BOT_SESSION_TTL_SEC=${BOT_SESSION_TTL_SEC:-2592000}
      - BOT_NAV_TTL_SEC=${BOT_NAV_TTL_SEC:-1800}
      - TELEGRAM_API_BASE=${TELEGRAM_API_BASE:-https://api.telegram.org}
      - TELEGRAM_DEEP_LINK_BASE=${TELEGRAM_DEEP_LINK_BASE:-https://t.me}
      - BALE_API_BASE=${BALE_API_BASE:-https://tapi.bale.ai}
      - BALE_DEEP_LINK_BASE=${BALE_DEEP_LINK_BASE:-https://ble.ir}
      # On boot this service points every tenant's bot at its own path,
      # <public base>/api/bots/<platform>/<webhookPath> (F-321).
      - BOT_WEBHOOK_AUTO_REGISTER=${BOT_WEBHOOK_AUTO_REGISTER:-true}
      - BOT_WEBHOOK_PUBLIC_BASE=${BOT_WEBHOOK_PUBLIC_BASE:-}
      - TELEGRAM_WEBHOOK_PUBLIC_BASE=${TELEGRAM_WEBHOOK_PUBLIC_BASE:-}
      - BALE_WEBHOOK_PUBLIC_BASE=${BALE_WEBHOOK_PUBLIC_BASE:-}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - PANEL_BASE_URL=https://panel.${DOMAIN_NAME}
      - TRUST_PROXY=${TRUST_PROXY}
      # The bot answers in DEFAULT_LANGUAGE unless a chat picks otherwise; the
      # messenger's own language_code is the last resort (ADR-0016). The three
      # BOT_* vars below are optional overrides — an unset one is simply absent
      # inside the container, which is what `:-` guarantees here.
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      - BOT_DEFAULT_LANGUAGE=${BOT_DEFAULT_LANGUAGE:-}
      # The same variable auth-service reads: the region a number typed in the
      # chat without a `+` belongs to. Unset, it follows the bot's language.
      - DEFAULT_PHONE_COUNTRY=${DEFAULT_PHONE_COUNTRY:-}
      - BOT_LANG_TTL_SEC=${BOT_LANG_TTL_SEC:-}
      - BOT_COMMAND_LANGS=${BOT_COMMAND_LANGS:-}
      - LOCALE_SERVICE_ADDR=locale-service:${LOCALE_SERVICE_HOST_PORT:-50051}
      - LOCALE_SCOPE=backend
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.bot-service.loadbalancer.server.port=${BOT_PORT:-3000}"
      # Explicit priority: auth-service's https router also matches the bare
      # host, so without this the two rules are decided by rule length alone.
      - "traefik.http.routers.bot-service-http.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/bot`)"
      - "traefik.http.routers.bot-service-http.entrypoints=web"
      - "traefik.http.routers.bot-service-http.priority=100"
      - "traefik.http.routers.bot-service-http.service=bot-service"
      - "traefik.http.routers.bot-service-https.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/bot`)"
      - "traefik.http.routers.bot-service-https.entrypoints=websecure"
      - "traefik.http.routers.bot-service-https.tls.certresolver=myresolver"
      - "traefik.http.routers.bot-service-https.priority=100"
      - "traefik.http.routers.bot-service-https.service=bot-service"
      - "txnet.logging=true"
    depends_on:
      auth-service:
        condition: service_started
      locale-service:
        condition: service_healthy
      # Since F-067-b the webhook's whole job is to publish, so this service
      # cannot serve its one route without the broker and refuses to boot
      # without RABBITMQ_URL.
      rabbitmq:
        condition: service_healthy

  # ===========================================================================
  # NestJS Worker Service (Nx Monorepo) — background work, no HTTP surface
  # ===========================================================================
  # ADR-0027: background work runs as RabbitMQ consumers in a process that
  # serves no requests. There are no Traefik labels and no port below, and that
  # is the decision rather than an omission — an in-process scheduler runs
  # inside a request-serving replica, so two replicas run every job twice and a
  # slow job degrades logins.
  worker-service:
    build:
      context: ../txnet-backend
      dockerfile: Dockerfile
      target: ${ENVIRONMENT}
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        - APP_NAME=worker-service
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-worker-service
    restart: unless-stopped
    volumes:
      - ../txnet-backend:/app:delegated
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      # Which app `scripts/dev-serve.js` builds and runs. The Dockerfile bakes
      # this from its `APP_NAME` build arg, but that arg sits in the *base*
      # stage, so giving it a new value invalidates the cache from layer one
      # and re-runs `npm ci` — which needs egress this host does not have.
      # Setting it here overrides the image's own ENV, so every backend app can
      # share one built image. The source tree is bind-mounted and
      # node_modules is a volume, so nothing else about the image differs.
      - APP_NAME=worker-service
      # The same NOBYPASSRLS login role auth-service uses, and no fallback to
      # the owner connection (F-066-m-a). automation's three worker tables
      # carry no tenantId and no policy; the grants cover every schema.
      - DATABASE_APP_URL=postgresql://txnet_app_user:${DB_APP_PASSWORD}@main-db:${MAIN_DB_PORT:-5432}/${MAIN_DB_NAME}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      # The shared store behind the per-tenant run cap (F-067-e). Same
      # namespace and version as auth-service and bot-service: one bump
      # abandons every key this platform holds (ADR-0005).
      - REDIS_URL=${REDIS_URL}
      - REDIS_KEY_NAMESPACE=${REDIS_KEY_NAMESPACE:-txnet:auth}
      - REDIS_KEYSPACE_VERSION=${REDIS_KEYSPACE_VERSION:-v2}
      - AUTOMATION_EXCHANGE=${AUTOMATION_EXCHANGE:-txnet.automation}  # default declared in shared-core/src/lib/automation/bot-update.ts (F-079)
      # `.v2`: F-067-d declares this queue with a dead-letter exchange, and a
      # durable queue's arguments cannot be changed in place — asserting the old
      # name would fail every boot with PRECONDITION_FAILED. The old
      # `txnet.automation.ticks` drains itself and can be deleted at leisure.
      - AUTOMATION_QUEUE=${AUTOMATION_QUEUE:-txnet.automation.ticks.v2}
      - AUTOMATION_DLX=${AUTOMATION_DLX:-txnet.automation.dlx}
      - AUTOMATION_DEAD_QUEUE=${AUTOMATION_DEAD_QUEUE:-txnet.automation.ticks.dead}
      - BOT_UPDATE_QUEUE_PREFIX=${BOT_UPDATE_QUEUE_PREFIX:-txnet.automation.bot.update}
      # One consumer per queue at prefetch 1, so a chat's updates stay in
      # order; the count is this bot's whole cross-chat parallelism (F-067-b).
      - BOT_UPDATE_QUEUES=${BOT_UPDATE_QUEUES:-4}
      - AUTOMATION_PREFETCH=${AUTOMATION_PREFETCH:-4}
      # Shared across replicas since F-067-e — a set of expiring leases in
      # Redis, not a per-process count.
      - AUTOMATION_TENANT_CONCURRENCY=${AUTOMATION_TENANT_CONCURRENCY:-2}
      - AUTOMATION_DEFER_MS=${AUTOMATION_DEFER_MS:-5000}
      # How many unpublished outbox_event rows one relay run claims (F-067-c).
      - AUTOMATION_OUTBOX_BATCH=${AUTOMATION_OUTBOX_BATCH:-100}
      - AUTOMATION_TICK_INTERVAL_MS=${AUTOMATION_TICK_INTERVAL_MS:-60000}
      # Also the lifetime of a tenant run lease (F-067-e): the slot a dead
      # process held and the run row it left open expire together.
      - AUTOMATION_RUN_TIMEOUT_MS=${AUTOMATION_RUN_TIMEOUT_MS:-600000}
      # The internal seam a job reaches another service's code through
      # (F-031-c). `VaultRetentionJob` calls auth-service because the
      # Credential Vault is tenant's code in that process and an Nx app cannot
      # import an Nx app. Both are optional here: this service boots without
      # them and the job fails its own run, into bot_execution_log.
      - AUTH_API_BASE_URL=http://auth-service:${AUTH_PORT}
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN:-}
      - AUTH_API_TIMEOUT_MS=${AUTH_API_TIMEOUT_MS:-30000}
      # The other end of the same seam: bot-service owns the conversation a
      # queued update runs (F-067-b).
      - BOT_API_BASE_URL=http://bot-service:${BOT_PORT:-3000}
      - BOT_API_TIMEOUT_MS=${BOT_API_TIMEOUT_MS:-30000}
      # The third end of it: billing-service owns what an expired top-up is —
      # the coupon reservation functions and this platform's two pools live
      # there (F-092-k). The same SERVICE_AUTH_TOKEN above opens it; the token
      # says which process is calling and never which user.
      - BILLING_API_BASE_URL=http://billing-service:3000
      - BILLING_API_TIMEOUT_MS=${BILLING_API_TIMEOUT_MS:-30000}
      # Reconciliation's own budget (F-092-l): a batch there is one call to a
      # bank per payment, and the bank is the slow part.
      - BILLING_RECONCILE_TIMEOUT_MS=${BILLING_RECONCILE_TIMEOUT_MS:-120000}
      # The campaign fan-out's end of the seam (F-035-d): notification-service
      # owns the rows and the audience query (ADR-0052).
      - NOTIFICATION_API_BASE_URL=http://notification-service:3000
      - NOTIFICATION_API_TIMEOUT_MS=${NOTIFICATION_API_TIMEOUT_MS:-60000}
      # The FX worker's sources and its per-source deadline (F-0603, D-22).
      # A list rather than a constant because three of the four exchanges are
      # on the US OFAC list since June 2026 and dropping one must be config.
      # The default is the two endpoints D-22 states in full; wallex and bitpin
      # are implemented but unverified.
      - FX_SOURCES=${FX_SOURCES:-nobitex,tabdeal}
      - FX_SOURCE_TIMEOUT_MS=${FX_SOURCE_TIMEOUT_MS:-3000}
      # The quorum and the hard sanity band F-0604 reduces with. Wide on
      # purpose: the band rejects what cannot be a price, the median handles
      # disagreement, and a sudden move is F-0605's.
      - FX_MIN_SOURCES=${FX_MIN_SOURCES:-2}
      - FX_SANITY_MIN_RIAL=${FX_SANITY_MIN_RIAL:-100000}
      - FX_SANITY_MAX_RIAL=${FX_SANITY_MAX_RIAL:-10000000}
      - FX_MAX_DEVIATION_PERCENT=${FX_MAX_DEVIATION_PERCENT:-5}
      - WORKER_NAME=${WORKER_NAME:-}
    networks:
      - private_backend_network
    labels:
      - "txnet.logging=true"
    depends_on:
      main-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ===========================================================================
  # NestJS Gateway Service (Nx Monorepo) — the WebSocket gateway (F-067-h)
  # ---------------------------------------------------------------------------
  # One socket per signed-in user, multiplexed into channels. It holds no
  # database and no JWT secret: the upgrade goes through `my-auth` like every
  # other request, and this process reads the identity headers that come back
  # (ADR-0030). That is the whole reason owning a realtime gateway is cheap
  # here — there is no second identity model to run beside the first.
  #
  # Its one dependency is the Redis holding `session:<id>`, which it re-reads
  # on a timer so a revoked session does not keep a live socket.
  # ===========================================================================
  gateway-service:
    build:
      context: ../txnet-backend
      dockerfile: Dockerfile
      target: ${ENVIRONMENT}
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        - APP_NAME=gateway-service
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-gateway-service
    restart: unless-stopped
    volumes:
      - ../txnet-backend:/app:delegated
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${REALTIME_PORT:-3000}
      # Same namespace and version as auth-service, bot-service and
      # worker-service: one bump abandons every key this platform holds
      # (ADR-0005). This process only ever reads `session:<id>`.
      - REDIS_URL=${REDIS_URL}
      - REDIS_KEY_NAMESPACE=${REDIS_KEY_NAMESPACE:-txnet:auth}
      - REDIS_KEYSPACE_VERSION=${REDIS_KEYSPACE_VERSION:-v2}
      # Must agree with the router rule below. A socket reachable on a path the
      # gate does not cover would be an unauthenticated socket.
      - REALTIME_PATH=${REALTIME_PATH:-/realtime}
      - REALTIME_HEARTBEAT_MS=${REALTIME_HEARTBEAT_MS:-30000}
      # The window a revoked session keeps its socket — a security number, not
      # a tuning one. One EXISTS per distinct session per tick.
      - REALTIME_SESSION_RECHECK_MS=${REALTIME_SESSION_RECHECK_MS:-60000}
      - REALTIME_MAX_SUBSCRIPTIONS=${REALTIME_MAX_SUBSCRIPTIONS:-32}
      - REALTIME_MAX_CONNECTIONS_PER_USER=${REALTIME_MAX_CONNECTIONS_PER_USER:-4}
      # The cap that applies when there is no user to count against (ADR-0031).
      - REALTIME_MAX_CONNECTIONS_PER_IP=${REALTIME_MAX_CONNECTIONS_PER_IP:-16}
      - REALTIME_MAX_FRAME_BYTES=${REALTIME_MAX_FRAME_BYTES:-8192}
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.gateway-service.loadbalancer.server.port=${REALTIME_PORT:-3000}"

      # The realtime router. `strip-fake-headers,my-auth-optional` in that
      # order: strip what the client claimed, then let the gate set what it
      # proved. Traefik runs a WebSocket upgrade through ForwardAuth like any
      # other request, which is what makes one gate answer for both (ADR-0030).
      #
      # **The optional gate, not `my-auth`** (ADR-0031). A socket here is the
      # live-data transport and is opened before anyone signs in, so an upgrade
      # with no credential has to reach the service rather than be refused at
      # the gate. A credential that *is* presented and fails is still a 401 —
      # the gate does not downgrade it — so an authenticated socket is exactly
      # as authenticated as it was before this changed.
      #
      # No rate-limit middleware here on purpose: `auth-rate-limit` counts
      # requests, and a WebSocket is one request that then lives for hours —
      # it would do nothing against the failure that matters, which is one
      # client opening sockets in a loop. That is capped inside the service
      # instead (REALTIME_MAX_CONNECTIONS_PER_USER, and
      # REALTIME_MAX_CONNECTIONS_PER_IP for anonymous sockets, which have no
      # user to be counted against).
      - "traefik.http.routers.gateway-service-http.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`${REALTIME_PATH:-/realtime}`)"
      - "traefik.http.routers.gateway-service-http.entrypoints=web"
      - "traefik.http.routers.gateway-service-http.middlewares=strip-fake-headers,my-auth-optional"
      - "traefik.http.routers.gateway-service-http.service=gateway-service"

      - "traefik.http.routers.gateway-service-https.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`${REALTIME_PATH:-/realtime}`)"
      - "traefik.http.routers.gateway-service-https.entrypoints=websecure"
      - "traefik.http.routers.gateway-service-https.tls.certresolver=myresolver"
      - "traefik.http.routers.gateway-service-https.middlewares=strip-fake-headers,my-auth-optional"
      - "traefik.http.routers.gateway-service-https.service=gateway-service"
      - "txnet.logging=true"
    depends_on:
      memory-data:
        condition: service_healthy

  # ===========================================================================
  # NestJS Billing Service (Nx Monorepo) — Protected by ForwardAuth
  # ===========================================================================
  billing-service:
    build:
      context: ../txnet-backend
      dockerfile: Dockerfile
      target: ${ENVIRONMENT}
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        - APP_NAME=billing-service
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-billing-service
    restart: unless-stopped
    # No `command:` — the image's CMD, as for auth-service. On the dev target
    # that is `scripts/dev-serve.js`: one webpack watch over the mounted
    # source, restarting the app on every save, so a code change needs no
    # rebuild. A pinned `node dist/.../main.js` ran whatever bundle was last
    # built and ignored every edit.
    volumes:
      - ../txnet-backend:/app:delegated
      - /app/node_modules
      # The same vault KEK auth-service mounts, read-only: this service decrypts
      # a gateway's merchant id itself (ADR-0039).
      - ./secrets/vault-kek:/run/secrets/vault-kek:ro
    environment:
      # Validated at boot by `app/config/env.validation.ts` (F-089); a typo'd
      # variable is a refusal to start rather than a default nobody chose.
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-development}
      - GLOBAL_PREFIX=${BILLING_GLOBAL_PREFIX:-api}
      - PUBLIC_HOST=billing-service
      # The panel calls this from the browser, cross-origin, the same way it
      # calls auth-service (F-093-c) — so the same origin, and the service
      # refuses to boot without one when NODE_ENV=production.
      - FRONTEND_ORIGIN=https://panel.${DOMAIN_NAME}
      # The platform's own processes on the internal seam (F-092-k): the
      # worker's expiry tick proves itself with this and nothing else reaches
      # `/api/internal/*`, which Traefik does not route at all. Empty closes
      # the seam — and is refused when NODE_ENV=production.
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN:-}
      # The HMAC key the deposit callback signs the payment result with; the
      # panel shows a result only under it. Same value on site-pwa below.
      - PAYMENT_RESULT_SECRET=${PAYMENT_RESULT_SECRET:-}
      # The other direction on the same seam (F-102-c): gateway management
      # relays a gateway's secrets to auth-service, the vault's only writer.
      - AUTH_API_BASE_URL=http://auth-service:${AUTH_PORT}
      # A Mini App's invoice link is made by the tenant's bot (F-104-q).
      - BOT_API_BASE_URL=http://bot-service:${BOT_PORT:-3000}
      # The app role, never the owner: RLS does not bind a table's owner
      # (F-066-m-a). Every gated route reads the tenant forward-auth forwards
      # (F-092-a) and uses this pool.
      - DATABASE_APP_URL=postgresql://txnet_app_user:${DB_APP_PASSWORD}@main-db:${MAIN_DB_PORT:-5432}/${MAIN_DB_NAME}
      # The second pool, for the one read that resolves a tenant instead of
      # running inside one: the public gateway callback's host lookup (F-092-j).
      # Its role's policy is `USING (true)` and it holds no BYPASSRLS.
      - DATABASE_CROSS_TENANT_URL=postgresql://txnet_cross_tenant_user:${DB_CROSS_TENANT_PASSWORD}@main-db:${MAIN_DB_PORT:-5432}/${MAIN_DB_NAME}
      # The response envelope translates through locale-service (F-094).
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      - LOCALE_SERVICE_ADDR=locale-service:${LOCALE_SERVICE_HOST_PORT:-50051}
      # Drafts catalog names in every language but the item's source (F-1533-d, ADR-0050).
      # Unset = no drafts; names still publish and read with the en -> fa fallback.
      - TRANSLATOR_URL=${TRANSLATOR_URL:-}
      # A local LLM first, LibreTranslate behind it (ADR-0050 amendment 3).
      # Unset TRANSLATOR_LLM_URL = LibreTranslate alone.
      - TRANSLATOR_LLM_URL=${TRANSLATOR_LLM_URL:-}
      - TRANSLATOR_LLM_MODEL=${TRANSLATOR_LLM_MODEL:-qwen2.5:3b}
      # A PATH, never the key (ADR-0026).
      - VAULT_KEK_FILE=${VAULT_KEK_FILE:-/run/secrets/vault-kek}
      # Refused when NODE_ENV=production.
      - PAYMENT_GATEWAY_SANDBOX=${PAYMENT_GATEWAY_SANDBOX:-false}
      # How long a pending top-up stays payable, and its coupon holds with it (F-092-i).
      - PAYMENT_PENDING_TTL_SEC=${PAYMENT_PENDING_TTL_SEC:-}
      # How long an expired top-up keeps its coupon holds — the bank may still charge it (F-092-ah).
      - COUPON_HOLD_AFTER_EXPIRY_SEC=${COUPON_HOLD_AFTER_EXPIRY_SEC:-}
      # How long the callback waits on the bank's verify before answering "verifying" (F-092-ab).
      - DEPOSIT_CALLBACK_VERIFY_BUDGET_MS=${DEPOSIT_CALLBACK_VERIFY_BUDGET_MS:-}
      # One gateway-callback origin for every tenant. Dev and test only — in
      # production the host is the tenant's own panel domain (ADR-0020).
      - PAYMENT_CALLBACK_ORIGIN=${PAYMENT_CALLBACK_ORIGIN:-}
      # The rate limiter's counters (F-092-r) — the keyspace every service writes.
      - REDIS_URL=${REDIS_URL}
      - REDIS_KEY_NAMESPACE=${REDIS_KEY_NAMESPACE:-txnet:auth}
      - REDIS_KEYSPACE_VERSION=${REDIS_KEYSPACE_VERSION:-v2}
      # Per-user limits; empty means the schema default (F-087).
      - PLATFORM_RATE_LIMIT_FACTOR=${PLATFORM_RATE_LIMIT_FACTOR:-}
      - DEPOSIT_GATEWAYS_RATE_LIMIT=${DEPOSIT_GATEWAYS_RATE_LIMIT:-}
      - DEPOSIT_QUOTE_RATE_LIMIT=${DEPOSIT_QUOTE_RATE_LIMIT:-}
      - DEPOSIT_START_RATE_LIMIT=${DEPOSIT_START_RATE_LIMIT:-}
      - DEPOSIT_IN_CHAT_RATE_LIMIT=${DEPOSIT_IN_CHAT_RATE_LIMIT:-}
      # The callback's budget is per authority, not per user: it is public.
      - DEPOSIT_CALLBACK_RATE_LIMIT=${DEPOSIT_CALLBACK_RATE_LIMIT:-}
      # Per gateway per minute: the webhook is public too (F-104-b).
      - DEPOSIT_WEBHOOK_RATE_LIMIT=${DEPOSIT_WEBHOOK_RATE_LIMIT:-}
      - WALLET_HISTORY_RATE_LIMIT=${WALLET_HISTORY_RATE_LIMIT:-}
      - WALLET_PAYMENTS_RATE_LIMIT=${WALLET_PAYMENTS_RATE_LIMIT:-}
      - GIFT_REDEEM_RATE_LIMIT=${GIFT_REDEEM_RATE_LIMIT:-}
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.billing-service.loadbalancer.server.port=3000"

      # `strip-fake-headers,my-auth` in that order: strip what the client
      # claimed, then let the gate set what it proved. The required gate, not
      # the optional one — every billing route needs a signed-in caller, and the
      # service refuses a request that arrives without the identity headers
      # (`app/request/identity.middleware.ts`). `/api/health` is not published.
      - "traefik.http.routers.billing-service-http.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/billing`)"
      - "traefik.http.routers.billing-service-http.entrypoints=web"
      - "traefik.http.routers.billing-service-http.middlewares=strip-fake-headers,my-auth"
      - "traefik.http.routers.billing-service-http.service=billing-service"

      - "traefik.http.routers.billing-service.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/billing`)"
      - "traefik.http.routers.billing-service.entrypoints=websecure"
      - "traefik.http.routers.billing-service.tls.certresolver=myresolver"
      - "traefik.http.routers.billing-service.middlewares=strip-fake-headers,my-auth"
      - "traefik.http.routers.billing-service.service=billing-service"

      # The CORS preflight, and the one thing `my-auth` must not see.
      #
      # The panel calls billing cross-origin with a bearer token (F-093-c), so
      # every call is preceded by an `OPTIONS` the browser sends **without**
      # the Authorization header — by specification. The gate refuses it, and a
      # refused preflight means the browser never sends the real request at
      # all: what the user sees is the panel's own "could not reach the server"
      # line, on a service that is up and answering. `auth-service` never hit
      # this because its routers carry no `my-auth`; billing is the first gated
      # thing a browser talks to directly.
      #
      # Nothing is weakened. A preflight carries no credentials, no cookies and
      # no body, `strip-fake-headers` still runs so nothing can claim an
      # identity on it, and the real request behind it still goes through the
      # gate. What answers here is the service's own `enableCors`, which knows
      # the allowed origin (`FRONTEND_ORIGIN`) and replies 204.
      #
      # Priority beats the two gated routers above and stays under the
      # callback's 200, which is Host-less and must keep winning on its path.
      - "traefik.http.routers.billing-preflight-http.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/billing`) && Method(`OPTIONS`)"
      - "traefik.http.routers.billing-preflight-http.entrypoints=web"
      - "traefik.http.routers.billing-preflight-http.priority=150"
      - "traefik.http.routers.billing-preflight-http.middlewares=strip-fake-headers"
      - "traefik.http.routers.billing-preflight-http.service=billing-service"

      - "traefik.http.routers.billing-preflight.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/billing`) && Method(`OPTIONS`)"
      - "traefik.http.routers.billing-preflight.entrypoints=websecure"
      - "traefik.http.routers.billing-preflight.priority=150"
      - "traefik.http.routers.billing-preflight.tls.certresolver=myresolver"
      - "traefik.http.routers.billing-preflight.middlewares=strip-fake-headers"
      - "traefik.http.routers.billing-preflight.service=billing-service"

      # Catalog management (F-026-d) runs inside billing-service (ADR-0049) but
      # is published on its own path, `/api/catalog` — the user's call,
      # 2026-09-14, over `/api/billing/catalog`. The same gate and the same
      # preflight exemption as billing above, for the same reasons.
      - "traefik.http.routers.catalog-http.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/catalog`)"
      - "traefik.http.routers.catalog-http.entrypoints=web"
      - "traefik.http.routers.catalog-http.middlewares=strip-fake-headers,my-auth"
      - "traefik.http.routers.catalog-http.service=billing-service"

      - "traefik.http.routers.catalog.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/catalog`)"
      - "traefik.http.routers.catalog.entrypoints=websecure"
      - "traefik.http.routers.catalog.tls.certresolver=myresolver"
      - "traefik.http.routers.catalog.middlewares=strip-fake-headers,my-auth"
      - "traefik.http.routers.catalog.service=billing-service"

      - "traefik.http.routers.catalog-preflight-http.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/catalog`) && Method(`OPTIONS`)"
      - "traefik.http.routers.catalog-preflight-http.entrypoints=web"
      - "traefik.http.routers.catalog-preflight-http.priority=150"
      - "traefik.http.routers.catalog-preflight-http.middlewares=strip-fake-headers"
      - "traefik.http.routers.catalog-preflight-http.service=billing-service"

      - "traefik.http.routers.catalog-preflight.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/catalog`) && Method(`OPTIONS`)"
      - "traefik.http.routers.catalog-preflight.entrypoints=websecure"
      - "traefik.http.routers.catalog-preflight.priority=150"
      - "traefik.http.routers.catalog-preflight.tls.certresolver=myresolver"
      - "traefik.http.routers.catalog-preflight.middlewares=strip-fake-headers"
      - "traefik.http.routers.catalog-preflight.service=billing-service"

      # The gateway callback (F-092-j) — the one billing route **without**
      # `my-auth`, because a bank redirects a browser to it and a browser
      # arriving from a bank carries no session. `strip-fake-headers` stays:
      # nothing reads an identity here, and a public route is exactly where a
      # forged `X-Tenant-Id` would be tried.
      #
      # **No `Host(...)` on purpose.** The callback is minted on each tenant's
      # own panel domain (ADR-0020), so a rule naming one host would work for
      # the platform and for nobody else, and adding a Traefik label per
      # reseller is the per-container tenancy ADR-0025 forecloses. The path is
      # the whole rule; which tenant it belongs to is decided by the service,
      # against `tenant_domain`, and a host nobody owns gets a neutral 404
      # there rather than a route here.
      #
      # The priority beats both the gated `/api/billing` routers above and the
      # panel's own `Host(panel.…)` router, which would otherwise serve this
      # path to Next.js. It is explicit rather than left to Traefik's
      # rule-length default, because that default is not a rule anyone should
      # have to recompute when a hostname changes.
      - "traefik.http.routers.billing-callback-http.rule=PathPrefix(`/api/billing/deposit/callback`)"
      - "traefik.http.routers.billing-callback-http.entrypoints=web"
      - "traefik.http.routers.billing-callback-http.priority=200"
      - "traefik.http.routers.billing-callback-http.middlewares=strip-fake-headers"
      - "traefik.http.routers.billing-callback-http.service=billing-service"

      - "traefik.http.routers.billing-callback.rule=PathPrefix(`/api/billing/deposit/callback`)"
      - "traefik.http.routers.billing-callback.entrypoints=websecure"
      - "traefik.http.routers.billing-callback.priority=200"
      - "traefik.http.routers.billing-callback.tls.certresolver=myresolver"
      - "traefik.http.routers.billing-callback.middlewares=strip-fake-headers"
      - "traefik.http.routers.billing-callback.service=billing-service"

      # The second public door (F-104-b, ADR-0051): a provider's server posts a
      # signed result. Same shape as the callback — no `my-auth`, no `Host(...)`
      # — because a provider calls one URL per gateway on whatever host it was
      # given; the gateway id in the path is resolved by the service, and an
      # unknown one is a neutral 404 there.
      - "traefik.http.routers.billing-webhook-http.rule=PathPrefix(`/api/billing/deposit/webhook/`)"
      - "traefik.http.routers.billing-webhook-http.entrypoints=web"
      - "traefik.http.routers.billing-webhook-http.priority=200"
      - "traefik.http.routers.billing-webhook-http.middlewares=strip-fake-headers"
      - "traefik.http.routers.billing-webhook-http.service=billing-service"

      - "traefik.http.routers.billing-webhook.rule=PathPrefix(`/api/billing/deposit/webhook/`)"
      - "traefik.http.routers.billing-webhook.entrypoints=websecure"
      - "traefik.http.routers.billing-webhook.priority=200"
      - "traefik.http.routers.billing-webhook.tls.certresolver=myresolver"
      - "traefik.http.routers.billing-webhook.middlewares=strip-fake-headers"
      - "traefik.http.routers.billing-webhook.service=billing-service"
      - "txnet.logging=true"
    depends_on:
      main-db:
        condition: service_healthy
      locale-service:
        condition: service_healthy

  # A user's in-app notifications (F-035-a, ADR-0052): its own deployable, the
  # way billing is. Same gate, same preflight exemption, same CORS origin.
  notification-service:
    build:
      context: ../txnet-backend
      dockerfile: Dockerfile
      target: ${ENVIRONMENT}
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        - APP_NAME=notification-service
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-notification-service
    restart: unless-stopped
    volumes:
      - ../txnet-backend:/app:delegated
      - /app/node_modules
    environment:
      # Validated at boot by `app/config/env.validation.ts`.
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-development}
      - GLOBAL_PREFIX=${NOTIFICATION_GLOBAL_PREFIX:-api}
      - PUBLIC_HOST=notification-service
      - FRONTEND_ORIGIN=https://panel.${DOMAIN_NAME}
      # Other units create a notification on `/api/internal/notifications`,
      # which Traefik does not route. Refused empty in production.
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN:-}
      # Campaign delivery (F-035-e): each tenant's primary bot and its token come
      # from auth-service's internal seam; the sends go to the bot APIs.
      - AUTH_API_BASE_URL=http://auth-service:${AUTH_PORT}
      - TELEGRAM_API_BASE=${TELEGRAM_API_BASE:-https://api.telegram.org}
      - BALE_API_BASE=${BALE_API_BASE:-https://tapi.bale.ai}
      # Campaign SMS (F-035-f, D-38): the platform's line, the OTP gateway's.
      # Empty boots; SMS rows then stay queued as stalled.
      - SMS_API_URL=${SMS_API_URL:-}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_SENDER=${SMS_SENDER_PRIVATE:-}
      # The app role, never the owner (F-066-m-a).
      - DATABASE_APP_URL=postgresql://txnet_app_user:${DB_APP_PASSWORD}@main-db:${MAIN_DB_PORT:-5432}/${MAIN_DB_NAME}
      # Campaign management only (F-035-c): a platform-wide campaign is
      # refused on the app role by RLS. A policy, not a bypass.
      - DATABASE_CROSS_TENANT_URL=postgresql://txnet_cross_tenant_user:${DB_CROSS_TENANT_PASSWORD}@main-db:${MAIN_DB_PORT:-5432}/${MAIN_DB_NAME}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      - LOCALE_SERVICE_ADDR=locale-service:${LOCALE_SERVICE_HOST_PORT:-50051}
      - REDIS_URL=${REDIS_URL}
      - REDIS_KEY_NAMESPACE=${REDIS_KEY_NAMESPACE:-txnet:auth}
      - REDIS_KEYSPACE_VERSION=${REDIS_KEYSPACE_VERSION:-v2}
      # Per-user limits; empty means the schema default (F-087).
      - PLATFORM_RATE_LIMIT_FACTOR=${PLATFORM_RATE_LIMIT_FACTOR:-}
      - NOTIFICATION_READ_RATE_LIMIT=${NOTIFICATION_READ_RATE_LIMIT:-}
      - NOTIFICATION_WRITE_RATE_LIMIT=${NOTIFICATION_WRITE_RATE_LIMIT:-}
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.notification-service.loadbalancer.server.port=3000"

      # The required gate, as for billing: every route needs a signed-in caller.
      - "traefik.http.routers.notification-service-http.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/notifications`)"
      - "traefik.http.routers.notification-service-http.entrypoints=web"
      - "traefik.http.routers.notification-service-http.middlewares=strip-fake-headers,my-auth"
      - "traefik.http.routers.notification-service-http.service=notification-service"

      - "traefik.http.routers.notification-service.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/notifications`)"
      - "traefik.http.routers.notification-service.entrypoints=websecure"
      - "traefik.http.routers.notification-service.tls.certresolver=myresolver"
      - "traefik.http.routers.notification-service.middlewares=strip-fake-headers,my-auth"
      - "traefik.http.routers.notification-service.service=notification-service"

      # The CORS preflight carries no Authorization header by specification;
      # billing's labels say why it must skip `my-auth` and why nothing weakens.
      - "traefik.http.routers.notification-preflight-http.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/notifications`) && Method(`OPTIONS`)"
      - "traefik.http.routers.notification-preflight-http.entrypoints=web"
      - "traefik.http.routers.notification-preflight-http.priority=150"
      - "traefik.http.routers.notification-preflight-http.middlewares=strip-fake-headers"
      - "traefik.http.routers.notification-preflight-http.service=notification-service"

      - "traefik.http.routers.notification-preflight.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/notifications`) && Method(`OPTIONS`)"
      - "traefik.http.routers.notification-preflight.entrypoints=websecure"
      - "traefik.http.routers.notification-preflight.priority=150"
      - "traefik.http.routers.notification-preflight.tls.certresolver=myresolver"
      - "traefik.http.routers.notification-preflight.middlewares=strip-fake-headers"
      - "traefik.http.routers.notification-preflight.service=notification-service"
      - "txnet.logging=true"
    depends_on:
      main-db:
        condition: service_healthy
      locale-service:
        condition: service_healthy

  # ===========================================================================
  # Next.js PWA — Main Frontend Application
  # ===========================================================================
  site-pwa:
    image: ${ENVIRONMENT}_site-pwa_${WEB_APP_VERSION:-latest}
    build:
      target: ${ENVIRONMENT}
      context: ../site-pwa
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
        # Empty unless the machine building the image needs a proxy for npm
        # (F-088). The value used to be baked into the Dockerfile as one
        # developer's host.
        BUILD_HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        BUILD_HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        BUILD_NO_PROXY: ${BUILD_NO_PROXY:-}
    container_name: ${STACK_NAME:-txnet}-site-pwa
    restart: unless-stopped
    volumes:
      - ../site-pwa:/app:delegated
      - ../site-pwa/node_modules:/app/node_modules
      - ../site-pwa/.next:/app/.next
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - PORT=8181
      - HOSTNAME=${DOMAIN_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - MAIN_DB_USERNAME=${MAIN_DB_USERNAME}
      - MAIN_DB_PASSWORD=${MAIN_DB_PASSWORD}
      - DB_PORT=${MAIN_DB_PORT:-5432}
      - SMS_USERNAME=${SMS_USERNAME}
      - SMS_PASS=${SMS_PASS}
      - SMS_SENDER_PRIVATE=${SMS_SENDER_PRIVATE}
      - JWT_SECRET_CAPTCHA=${JWT_SECRET_CAPTCHA}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - NEXT_PUBLIC_PAYMENT_URL=${NEXT_PUBLIC_PAYMENT_URL}
      # Browser talks to auth-service directly at api.${DOMAIN_NAME}, cross-origin,
      # cookie-bearing (backend CORS in main.ts allows FRONTEND_ORIGIN with
      # credentials). Deliberate tradeoff vs. the old same-origin proxy hop:
      # this leaves private_backend_network for public DNS + Traefik + TLS and
      # back on every auth call (~0.5-2s), which previously surfaced as an
      # intermittent 502 on login/register — accepted so cookies land without
      # the proxy rewriting anything.
      # Server only: verifies billing's signed payment result (?t=), so a
      # hand-typed /payment/success?ref=… shows nothing. Same value as billing.
      - PAYMENT_RESULT_SECRET=${PAYMENT_RESULT_SECRET:-}
      - NEXT_PUBLIC_API_ORIGIN=https://api.${DOMAIN_NAME}
      # Server-to-server only, for the auth-screen session check in src/proxy.ts:
      # that one stays on private_backend_network, since it runs before the login
      # page renders and the public hop above would be the whole delay the check
      # exists to avoid. A failure here just shows the login form.
      - AUTH_SERVICE_ORIGIN=http://auth-service:${AUTH_PORT}
      - LOCALE_SERVICE_ADDR=locale-service:${LOCALE_SERVICE_HOST_PORT:-50051}
      - LOCALE_SCOPE=frontend
      # The language a stranger is answered in, same variable the backend reads.
      # Both names, one value: only NEXT_PUBLIC_ reaches the browser bundle, and
      # `lib/phone` needs it there to open the country picker on the right
      # region (src/env.ts).
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      - NEXT_PUBLIC_DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      # The realtime gateway answers on api.${DOMAIN_NAME} at the same path the
      # Traefik router rule below carries my-auth-optional on. NEXT_PUBLIC_ is
      # the only prefix Next inlines into the browser bundle, and the socket is
      # opened only there (src/env.ts). One value, from the same REALTIME_PATH
      # gateway-service reads, so the two cannot drift apart.
      - NEXT_PUBLIC_REALTIME_PATH=${REALTIME_PATH:-/realtime}
    depends_on:
      locale-service:
        condition: service_healthy
    networks:
      - private_backend_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # (no custom `dns:` — it would break resolution of compose service names;
    #  set upstream DNS in /etc/docker/daemon.json if you need it)
    labels:
      - "traefik.enable=true"
      # Panel subdomain
      - "traefik.http.routers.nextjs.rule=Host(`panel.${DOMAIN_NAME}`)"
      - "traefik.http.routers.nextjs.entrypoints=websecure"
      - "traefik.http.routers.nextjs.tls.certresolver=myresolver"
      - "traefik.http.routers.nextjs.middlewares=nextjs-compress,pwa-security,sw-cache-control"
      # Compression
      - "traefik.http.middlewares.nextjs-compress.compress=true"
      # Security headers for PWA
      - "traefik.http.middlewares.pwa-security.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.pwa-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.pwa-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.pwa-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.pwa-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.pwa-security.headers.stsIncludeSubdomains=true"
      # Service Worker cache control
      - "traefik.http.middlewares.sw-cache-control.headers.customResponseHeaders.Cache-Control=no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
      # Backend port
      - "traefik.http.services.nextjs.loadbalancer.server.port=8181"
      - "txnet.logging=true"

  # ===========================================================================
  # Coinsite — Secondary Next.js Frontend
  # ===========================================================================
  coinsite:
    image: ${ENVIRONMENT}_coinsite_${WEB_APP_VERSION:-latest}
    build:
      target: ${ENVIRONMENT}
      context: ../coinsite
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-coinsite
    restart: unless-stopped
    volumes:
      - ../coinsite:/app:delegated
      - /app/node_modules # anonymous vol: keep the image's node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      # The apex domain greets visitors in the deployment's language. coinsite
      # has no locale-service client, so this is the whole of its i18n: `lang`
      # and `dir` on <html> (src/env.ts).
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      - NEXT_PUBLIC_DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.coinsite.rule=Host(`${DOMAIN_NAME}`) || Host(`www.${DOMAIN_NAME}`)"
      - "traefik.http.routers.coinsite.entrypoints=websecure"
      - "traefik.http.routers.coinsite.tls.certresolver=myresolver"
      - "traefik.http.services.coinsite.loadbalancer.server.port=8080"
      - "txnet.logging=true"

  # ===========================================================================
  # Redis — Session Store & Cache
  # ===========================================================================
  memory-data:
    image: ${DOCKER_REGISTRY}/redis:8.8-alpine
    container_name: ${STACK_NAME:-txnet}-redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_vol_internal:/data
    networks:
      - private_backend_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "${REDIS_PASSWORD}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # PostgreSQL — Primary Relational Database
  # ===========================================================================
  main-db:
    image: ${DOCKER_REGISTRY}/postgres:18-alpine
    container_name: ${STACK_NAME:-txnet}-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${MAIN_DB_USERNAME}
      - POSTGRES_PASSWORD=${MAIN_DB_PASSWORD}
      - POSTGRES_DB=${MAIN_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - private_backend_network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${MAIN_DB_USERNAME} -d ${MAIN_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # RabbitMQ — Message Broker
  # ===========================================================================
  rabbitmq:
    image: ${DOCKER_REGISTRY}/rabbitmq:4.2-management-alpine
    container_name: ${STACK_NAME:-txnet}-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - private_backend_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mq-admin.rule=Host(`mq.${DOMAIN_NAME}`)"
      - "traefik.http.routers.mq-admin.entrypoints=websecure"
      - "traefik.http.routers.mq-admin.tls.certresolver=myresolver"
      - "traefik.http.services.mq-admin.loadbalancer.server.port=15672"
