# =============================================================================
# TXNet — Main Application Stack (Local Dev)
# =============================================================================
# Contains: Traefik, Go Auth Handler, NestJS Backends, Next.js Frontends,
#           Redis, PostgreSQL, RabbitMQ
#
# Usage:
#   docker compose -p txnet-main -f docker-compose.main.yml up -d --build
# =============================================================================

networks:
  public_gateway_network:
    name: ${PUBLIC_NET_NAME:-public_gateway_network}

  private_backend_network:
    name: ${PRIVATE_NET_NAME:-private_backend_network}
    driver: bridge
    # No fixed subnet: let Docker pick a free pool. Pinning a /16 makes a
    # second stack (or a leftover network) fail with "Pool overlaps".
    # To pin one anyway, add:  ipam: { config: [{ subnet: 10.x.0.0/16 }] }

volumes:
  redis_vol_internal:
  postgres_data:
  rabbitmq_data:

services:
  # ===========================================================================
  # Traefik v3.7 — Reverse Proxy & TLS Termination
  # ===========================================================================
  gateway-handler:
    image: ${DOCKER_REGISTRY}/traefik:v3.7
    container_name: ${STACK_NAME:-txnet}-gateway
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${PRIVATE_NET_NAME:-private_backend_network}"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt — HTTP challenge (production)
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${EMAIL_SSL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "${HTTP_ENTRANCE_PORT:-80}:80"
      - "${HTTPS_ENTRANCE_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../dev_letsencrypt:/letsencrypt
    networks:
      - public_gateway_network
      - private_backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard-http.rule=Host(`monitor.${DOMAIN_NAME}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard-http.entrypoints=web"
      - "traefik.http.routers.dashboard-http.service=api@internal"
      - "traefik.http.routers.dashboard-http.middlewares=auth-dashboard"
      - "traefik.http.routers.dashboard-https.rule=Host(`monitor.${DOMAIN_NAME}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard-https.entrypoints=websecure"
      - "traefik.http.routers.dashboard-https.tls.certresolver=myresolver"
      - "traefik.http.routers.dashboard-https.service=api@internal"
      - "traefik.http.routers.dashboard-https.middlewares=auth-dashboard"
      - "traefik.http.middlewares.auth-dashboard.basicauth.users=${TRAEFIK_PANEL_USERNAME}:${TRAEFIK_PANEL_PASSWORD}"
      - "txnet.logging=true"

  # ===========================================================================
  # locale-service — i18n source of truth (gRPC). Every backend/frontend
  # service preloads a scope from here on boot and keeps it live via Watch.
  # ===========================================================================
  locale-service:
    build:
      context: ../i18n-platform/services/locale-service
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-txnet}-locale-service
    restart: unless-stopped
    volumes:
      - ../locales:/locales:ro
    environment:
      - GRPC_ADDR=:${LOCALE_SERVICE_HOST_PORT:-50051}
      - LOCALES_DIR=/locales
    healthcheck:
      test: ["CMD", "/usr/local/bin/locale-service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    networks:
      - private_backend_network
    labels:
      - "txnet.logging=true"

  # ===========================================================================
  # Go Authorization Handler — Traefik ForwardAuth Middleware
  # ===========================================================================
  authorization-handler:
    build:
      context: .. # repo root — shared Go module lives here
      dockerfile: auth-handler/Dockerfile
      target: ${ENVIRONMENT}
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-auth-handler
    restart: unless-stopped
    working_dir: /src/auth-handler
    volumes:
      - ../auth-handler:/src/auth-handler
      - ../i18n-platform/clients/go:/src/i18n-platform/clients/go:ro
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT}
      - JWT_SECRET=${JWT_ACCESS_SECRET}
      - REDIS_URL=${REDIS_URL}
      - REDIS_KEY_NAMESPACE=${REDIS_KEY_NAMESPACE:-txnet:auth}
      - REDIS_KEYSPACE_VERSION=${REDIS_KEYSPACE_VERSION:-v3}
      - PERMISSIONS_FILE_PATH=/src/auth-handler/configs/permissions.yaml
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      - LOCALE_SERVICE_ADDR=locale-service:${LOCALE_SERVICE_HOST_PORT:-50051}
      - LOCALE_SCOPE=backend
    depends_on:
      locale-service:
        condition: service_healthy
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      # ForwardAuth middleware — validates every request that uses it
      - "traefik.http.middlewares.my-auth.forwardauth.address=http://authorization-handler:${INTERAL_BACKEND_PORT:-8080}/validate"
      # Strip fake headers from incoming requests (security)
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-User-Id="
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-Actor-Id="
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-User-Permissions="
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-Tenant-Id="
      - "traefik.http.middlewares.strip-fake-headers.headers.customrequestheaders.X-Role-Id="
      - "traefik.http.middlewares.my-auth.forwardauth.authResponseHeaders=X-User-Id,X-Tenant-Id,X-Role-Id,X-User-Permissions,X-Impersonated,X-Impersonated-By"

      - "txnet.logging=true"

  # ===========================================================================
  # NestJS Auth Service (Nx Monorepo)
  # ===========================================================================
  auth-service:
    build:
      context: ../txnet-backend
      dockerfile: Dockerfile
      target: ${ENVIRONMENT}
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        - APP_NAME=auth-service
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-auth-service
    restart: unless-stopped
    volumes:
      - ../txnet-backend:/app:delegated
      - /app/node_modules
      # The Credential Vault's KEK (ADR-0026). Mounted as a file, read-only,
      # because it must never be an environment variable — an env var is
      # readable from `docker inspect` and from every child process. In Swarm
      # this is a real `secrets:` entry landing at the same path; here it is a
      # bind mount so the dev stack needs no swarm mode. `:ro` and the leading
      # `./secrets/` are both deliberate: nothing in the app writes it.
      - ./secrets/vault-kek:/run/secrets/vault-kek:ro
    environment:
      - PORT=${AUTH_PORT}
      - NODE_ENV=${NODE_ENV:-development}
      # The owner connection. Prisma's CLI reads it by name; the running
      # service does not use it — it owns every table, and Row-Level
      # Security does not apply to a table's owner (F-066-m-a).
      - DATABASE_URL=postgresql://${MAIN_DB_USERNAME}:${MAIN_DB_PASSWORD}@main-db:${MAIN_DB_PORT:-5432}/${MAIN_DB_NAME}
      # What the service actually connects with: a login role that owns
      # nothing and carries NOBYPASSRLS, so the policies bind. Created by
      # `./scripts/db-login-roles.sh`, which is a manual step on an
      # existing database — the service refuses to boot without it.
      - DATABASE_APP_URL=postgresql://txnet_app_user:${DB_APP_PASSWORD}@main-db:${MAIN_DB_PORT:-5432}/${MAIN_DB_NAME}
      # The second pool (F-066-m-b). Same database, different role: its policy
      # is `USING (true)`, so it answers the reads that resolve a tenant and
      # therefore cannot run inside one. A policy, not a bypass — this role
      # carries NOBYPASSRLS too.
      - DATABASE_CROSS_TENANT_URL=postgresql://txnet_cross_tenant_user:${DB_CROSS_TENANT_PASSWORD}@main-db:${MAIN_DB_PORT:-5432}/${MAIN_DB_NAME}
      - REDIS_URL=${REDIS_URL}
      - REDIS_KEY_NAMESPACE=${REDIS_KEY_NAMESPACE:-txnet:auth}
      - REDIS_KEYSPACE_VERSION=${REDIS_KEYSPACE_VERSION:-v3}
      # The one message this process publishes: an `admin_manual` tick from
      # `POST /admin/workers/:key/run` (F-031-b). Optional by design — the
      # connection is opened on first use, so an environment without a broker
      # boots and serves logins, and only that route answers 503.
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      - AUTOMATION_EXCHANGE=${AUTOMATION_EXCHANGE:-txnet.automation}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_HASH_SECRET=${JWT_REFRESH_HASH_SECRET}
      - JWT_ACCESS_TTL_SEC=${JWT_ACCESS_TTL_SEC:-900}
      - OTP_TOKEN_TTL_SEC=${OTP_TOKEN_TTL_SEC:-300}
      - RESET_TOKEN_TTL_SEC=${RESET_TOKEN_TTL_SEC:-300}
      # Abuse limits. Defaults are what the code shipped with; a deployment
      # with a different risk appetite moves them without a rebuild.
      - LOGIN_FAILURE_LOCK_THRESHOLD=${LOGIN_FAILURE_LOCK_THRESHOLD:-10}
      - CAPTCHA_RATE_LIMIT=${CAPTCHA_RATE_LIMIT:-30}
      - FORGOT_VERIFY_RATE_LIMIT=${FORGOT_VERIFY_RATE_LIMIT:-20}
      - OTP_DELIVERY_MODE=${OTP_DELIVERY_MODE:-console}
      # Which delivery methods this environment offers. Drop one from the list
      # and it disappears from GET /api/auth/otp/channels as well.
      - OTP_ALLOWED_CHANNELS=${OTP_ALLOWED_CHANNELS:-sms}
      - OTP_DEV_CONSOLE_LOG=${OTP_DEV_CONSOLE_LOG:-false}
      - BOT_LINK_TOKEN_TTL_SEC=${BOT_LINK_TOKEN_TTL_SEC:-900}
      # Telegram / Bale, as platforms: the API host and the deep-link host,
      # which are the same whoever the bot belongs to. Every bot's token,
      # username and webhook secret is its tenant's, and lives on that tenant's
      # BotIntegration row and in the Credential Vault (F-066-i).
      - TELEGRAM_API_BASE=${TELEGRAM_API_BASE:-https://api.telegram.org}
      - TELEGRAM_DEEP_LINK_BASE=${TELEGRAM_DEEP_LINK_BASE:-https://t.me}
      - BALE_API_BASE=${BALE_API_BASE:-https://tapi.bale.ai}
      - BALE_DEEP_LINK_BASE=${BALE_DEEP_LINK_BASE:-https://ble.ir}
      # The webhook belongs to bot-service (ADR-0011); the deprecated route
      # this service kept for one release is gone with F-066-i.
      # Shared secret bot-service presents as X-Service-Token: it waives the
      # captcha and re-buckets the rate limit, and authenticates no user.
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN:-}
      - SMS_API_URL=${SMS_API_URL:-}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_SENDER=${SMS_SENDER_PRIVATE:-}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - FRONTEND_ORIGIN=https://panel.${DOMAIN_NAME}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - TRUST_PROXY=${TRUST_PROXY}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      # No DEFAULT_TENANT_SLUG: there is no fallback tenant (ADR-0025). A Host
      # that matches no tenant_domain row is answered a neutral 404, so the dev
      # stack depends on `node prisma/seed.js` having created the row for
      # api.${DOMAIN_NAME} — see .env.example.
      # Phone numbers are every country by default (ADR-0018). The region a
      # number typed without `+` belongs to follows DEFAULT_LANGUAGE unless
      # DEFAULT_PHONE_COUNTRY overrides it.
      - DEFAULT_PHONE_COUNTRY=${DEFAULT_PHONE_COUNTRY:-}
      - SUPPORTED_PHONE_COUNTRIES=${SUPPORTED_PHONE_COUNTRIES:-}
      - LOCALE_SERVICE_ADDR=locale-service:${LOCALE_SERVICE_HOST_PORT:-50051}
      - LOCALE_SCOPE=backend
      # A PATH to the mounted secret above, never the key itself (ADR-0026).
      # Unset it and the service still boots, refusing every credential
      # operation — nothing writes a tenant credential until F-066-i.
      - VAULT_KEK_FILE=${VAULT_KEK_FILE:-/run/secrets/vault-kek}
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      # CORS is handled inside the app (app.enableCors, FRONTEND_ORIGIN) —
      # do not also apply a Traefik-level CORS headers middleware here. A
      # second layer duplicates Access-Control-Allow-* on the same response,
      # which browsers reject, so the preflight/POST for login+register
      # never lands and refresh_token never gets set client-side.
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.period=1m"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.burst=50"
      - "traefik.http.services.auth-service.loadbalancer.server.port=${AUTH_PORT}"

        # http router for auth-service (with TLS)

      - "traefik.http.routers.auth-service-http.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/auth`)"
      # - "traefik.http.routers.auth-service-http.rule=Host(`api.${DOMAIN_NAME}`)"
      - "traefik.http.routers.auth-service-http.entrypoints=web"
      - "traefik.http.routers.auth-service-http.middlewares=auth-rate-limit"
      - "traefik.http.routers.auth-service-http.service=auth-service"

      # https router for auth-service (with TLS)
      - "traefik.http.routers.auth-service-https.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth-service-https.rule=Host(`api.${DOMAIN_NAME}`)"
      - "traefik.http.routers.auth-service-https.entrypoints=websecure"
      - "traefik.http.routers.auth-service-https.tls.certresolver=myresolver"
      - "traefik.http.routers.auth-service-https.middlewares=auth-rate-limit"

      - "traefik.http.routers.auth-service-https.service=auth-service"
      - "txnet.logging=true"
    depends_on:
      main-db:
        condition: service_healthy
      locale-service:
        condition: service_healthy

  # ===========================================================================
  # NestJS Bot Service (Nx Monorepo) — the Telegram/Bale surface
  # ---------------------------------------------------------------------------
  # It holds no database credentials and no JWT secret on purpose: every
  # decision comes from auth-service over HTTP, exactly as the panel's does
  # (ADR-0009). What it owns is the inbound webhook — one unguessable path per
  # bot — and the conversation state in Redis.
  # ===========================================================================
  bot-service:
    build:
      context: ../txnet-backend
      dockerfile: Dockerfile
      target: ${ENVIRONMENT}
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        - APP_NAME=bot-service
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-bot-service
    restart: unless-stopped
    volumes:
      - ../txnet-backend:/app:delegated
      - /app/node_modules
    environment:
      - PORT=${BOT_PORT:-3000}
      - NODE_ENV=${NODE_ENV:-development}
      - REDIS_URL=${REDIS_URL}
      # Same namespace and version as auth-service: one bump abandons every
      # key this platform holds, bot sessions included (ADR-0005).
      - REDIS_KEY_NAMESPACE=${REDIS_KEY_NAMESPACE:-txnet:auth}
      - REDIS_KEYSPACE_VERSION=${REDIS_KEYSPACE_VERSION:-v3}
      # In-network, so bot traffic never leaves the private network to reach
      # the API it depends on.
      - AUTH_API_BASE_URL=http://auth-service:${AUTH_PORT}
      # A bot chat has no host to resolve a tenant from, and there is no
      # fallback tenant (ADR-0025). Since F-066-i an update names its own
      # tenant — the one its webhook path resolved to — so this is only the
      # fallback for calls that are not answering an update. `prisma/seed.js`
      # prints the id it created.
      - BOT_TENANT_ID=${BOT_TENANT_ID:-}
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN:-}
      - BOT_SESSION_TTL_SEC=${BOT_SESSION_TTL_SEC:-2592000}
      - BOT_NAV_TTL_SEC=${BOT_NAV_TTL_SEC:-1800}
      - TELEGRAM_API_BASE=${TELEGRAM_API_BASE:-https://api.telegram.org}
      - TELEGRAM_DEEP_LINK_BASE=${TELEGRAM_DEEP_LINK_BASE:-https://t.me}
      - BALE_API_BASE=${BALE_API_BASE:-https://tapi.bale.ai}
      - BALE_DEEP_LINK_BASE=${BALE_DEEP_LINK_BASE:-https://ble.ir}
      # On boot this service points every tenant's bot at its own path,
      # <public base>/api/bots/<platform>/<webhookPath> (F-321).
      - BOT_WEBHOOK_AUTO_REGISTER=${BOT_WEBHOOK_AUTO_REGISTER:-true}
      - BOT_WEBHOOK_PUBLIC_BASE=${BOT_WEBHOOK_PUBLIC_BASE:-}
      - TELEGRAM_WEBHOOK_PUBLIC_BASE=${TELEGRAM_WEBHOOK_PUBLIC_BASE:-}
      - BALE_WEBHOOK_PUBLIC_BASE=${BALE_WEBHOOK_PUBLIC_BASE:-}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - PANEL_BASE_URL=https://panel.${DOMAIN_NAME}
      - TRUST_PROXY=${TRUST_PROXY}
      # The bot answers in DEFAULT_LANGUAGE unless a chat picks otherwise; the
      # messenger's own language_code is the last resort (ADR-0016). The three
      # BOT_* vars below are optional overrides — an unset one is simply absent
      # inside the container, which is what `:-` guarantees here.
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      - BOT_DEFAULT_LANGUAGE=${BOT_DEFAULT_LANGUAGE:-}
      # The same variable auth-service reads: the region a number typed in the
      # chat without a `+` belongs to. Unset, it follows the bot's language.
      - DEFAULT_PHONE_COUNTRY=${DEFAULT_PHONE_COUNTRY:-}
      - BOT_LANG_TTL_SEC=${BOT_LANG_TTL_SEC:-}
      - BOT_COMMAND_LANGS=${BOT_COMMAND_LANGS:-}
      - LOCALE_SERVICE_ADDR=locale-service:${LOCALE_SERVICE_HOST_PORT:-50051}
      - LOCALE_SCOPE=backend
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.bot-service.loadbalancer.server.port=${BOT_PORT:-3000}"
      # Explicit priority: auth-service's https router also matches the bare
      # host, so without this the two rules are decided by rule length alone.
      - "traefik.http.routers.bot-service-http.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/bot`)"
      - "traefik.http.routers.bot-service-http.entrypoints=web"
      - "traefik.http.routers.bot-service-http.priority=100"
      - "traefik.http.routers.bot-service-http.service=bot-service"
      - "traefik.http.routers.bot-service-https.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/bot`)"
      - "traefik.http.routers.bot-service-https.entrypoints=websecure"
      - "traefik.http.routers.bot-service-https.tls.certresolver=myresolver"
      - "traefik.http.routers.bot-service-https.priority=100"
      - "traefik.http.routers.bot-service-https.service=bot-service"
      - "txnet.logging=true"
    depends_on:
      auth-service:
        condition: service_started
      locale-service:
        condition: service_healthy

  # ===========================================================================
  # NestJS Worker Service (Nx Monorepo) — background work, no HTTP surface
  # ===========================================================================
  # ADR-0027: background work runs as RabbitMQ consumers in a process that
  # serves no requests. There are no Traefik labels and no port below, and that
  # is the decision rather than an omission — an in-process scheduler runs
  # inside a request-serving replica, so two replicas run every job twice and a
  # slow job degrades logins.
  worker-service:
    build:
      context: ../txnet-backend
      dockerfile: Dockerfile
      target: ${ENVIRONMENT}
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        - APP_NAME=worker-service
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-worker-service
    restart: unless-stopped
    volumes:
      - ../txnet-backend:/app:delegated
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      # The same NOBYPASSRLS login role auth-service uses, and no fallback to
      # the owner connection (F-066-m-a). automation's three worker tables
      # carry no tenantId and no policy; the grants cover every schema.
      - DATABASE_APP_URL=postgresql://txnet_app_user:${DB_APP_PASSWORD}@main-db:${MAIN_DB_PORT:-5432}/${MAIN_DB_NAME}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      - AUTOMATION_EXCHANGE=${AUTOMATION_EXCHANGE:-txnet.automation}
      - AUTOMATION_QUEUE=${AUTOMATION_QUEUE:-txnet.automation.ticks}
      - AUTOMATION_PREFETCH=${AUTOMATION_PREFETCH:-4}
      - AUTOMATION_TENANT_CONCURRENCY=${AUTOMATION_TENANT_CONCURRENCY:-2}
      - AUTOMATION_DEFER_MS=${AUTOMATION_DEFER_MS:-5000}
      - AUTOMATION_TICK_INTERVAL_MS=${AUTOMATION_TICK_INTERVAL_MS:-60000}
      - AUTOMATION_RUN_TIMEOUT_MS=${AUTOMATION_RUN_TIMEOUT_MS:-600000}
      # The internal seam a job reaches another service's code through
      # (F-031-c). `VaultRetentionJob` calls auth-service because the
      # Credential Vault is tenant's code in that process and an Nx app cannot
      # import an Nx app. Both are optional here: this service boots without
      # them and the job fails its own run, into bot_execution_log.
      - AUTH_API_BASE_URL=http://auth-service:${AUTH_PORT}
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN:-}
      - AUTH_API_TIMEOUT_MS=${AUTH_API_TIMEOUT_MS:-30000}
      - WORKER_NAME=${WORKER_NAME:-}
    networks:
      - private_backend_network
    labels:
      - "txnet.logging=true"
    depends_on:
      main-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ===========================================================================
  # NestJS Billing Service (Nx Monorepo) — Protected by ForwardAuth
  # ===========================================================================
  billing-service:
    build:
      context: ../txnet-backend
      dockerfile: Dockerfile
      target: ${ENVIRONMENT}
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        - APP_NAME=billing-service
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-billing-service
    restart: unless-stopped
    command: node dist/billing-service/main.js
    volumes:
      - ../txnet-backend:/app:delegated
      - /app/node_modules
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.billing-service.rule=Host(`api.${DOMAIN_NAME}`) && PathPrefix(`/api/billing`)"
      - "traefik.http.routers.billing-service.entrypoints=websecure"
      - "traefik.http.routers.billing-service.tls.certresolver=myresolver"
      - "traefik.http.routers.billing-service.middlewares=strip-fake-headers,my-auth"
      - "traefik.http.services.billing-service.loadbalancer.server.port=3000"
      - "txnet.logging=true"

  # ===========================================================================
  # Next.js PWA — Main Frontend Application
  # ===========================================================================
  site-pwa:
    image: ${ENVIRONMENT}_site-pwa_${WEB_APP_VERSION:-latest}
    build:
      target: ${ENVIRONMENT}
      context: ../site-pwa
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-site-pwa
    restart: unless-stopped
    volumes:
      - ../site-pwa:/app:delegated
      - ../site-pwa/node_modules:/app/node_modules
      - ../site-pwa/.next:/app/.next
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - PORT=8181
      - HOSTNAME=${DOMAIN_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - MAIN_DB_USERNAME=${MAIN_DB_USERNAME}
      - MAIN_DB_PASSWORD=${MAIN_DB_PASSWORD}
      - DB_PORT=${MAIN_DB_PORT:-5432}
      - SMS_USERNAME=${SMS_USERNAME}
      - SMS_PASS=${SMS_PASS}
      - SMS_SENDER_PRIVATE=${SMS_SENDER_PRIVATE}
      - JWT_SECRET_CAPTCHA=${JWT_SECRET_CAPTCHA}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - NEXT_PUBLIC_PAYMENT_URL=${NEXT_PUBLIC_PAYMENT_URL}
      # Browser talks to auth-service directly at api.${DOMAIN_NAME}, cross-origin,
      # cookie-bearing (backend CORS in main.ts allows FRONTEND_ORIGIN with
      # credentials). Deliberate tradeoff vs. the old same-origin proxy hop:
      # this leaves private_backend_network for public DNS + Traefik + TLS and
      # back on every auth call (~0.5-2s), which previously surfaced as an
      # intermittent 502 on login/register — accepted so cookies land without
      # the proxy rewriting anything.
      - NEXT_PUBLIC_API_ORIGIN=https://api.${DOMAIN_NAME}
      # Server-to-server only, for the auth-screen session check in src/proxy.ts:
      # that one stays on private_backend_network, since it runs before the login
      # page renders and the public hop above would be the whole delay the check
      # exists to avoid. A failure here just shows the login form.
      - AUTH_SERVICE_ORIGIN=http://auth-service:${AUTH_PORT}
      - LOCALE_SERVICE_ADDR=locale-service:${LOCALE_SERVICE_HOST_PORT:-50051}
      - LOCALE_SCOPE=frontend
    depends_on:
      locale-service:
        condition: service_healthy
    networks:
      - private_backend_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # (no custom `dns:` — it would break resolution of compose service names;
    #  set upstream DNS in /etc/docker/daemon.json if you need it)
    labels:
      - "traefik.enable=true"
      # Panel subdomain
      - "traefik.http.routers.nextjs.rule=Host(`panel.${DOMAIN_NAME}`)"
      - "traefik.http.routers.nextjs.entrypoints=websecure"
      - "traefik.http.routers.nextjs.tls.certresolver=myresolver"
      - "traefik.http.routers.nextjs.middlewares=nextjs-compress,pwa-security,sw-cache-control"
      # Compression
      - "traefik.http.middlewares.nextjs-compress.compress=true"
      # Security headers for PWA
      - "traefik.http.middlewares.pwa-security.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.pwa-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.pwa-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.pwa-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.pwa-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.pwa-security.headers.stsIncludeSubdomains=true"
      # Service Worker cache control
      - "traefik.http.middlewares.sw-cache-control.headers.customResponseHeaders.Cache-Control=no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
      # Backend port
      - "traefik.http.services.nextjs.loadbalancer.server.port=8181"
      - "txnet.logging=true"

  # ===========================================================================
  # Coinsite — Secondary Next.js Frontend
  # ===========================================================================
  coinsite:
    image: ${ENVIRONMENT}_coinsite_${WEB_APP_VERSION:-latest}
    build:
      target: ${ENVIRONMENT}
      context: ../coinsite
      extra_hosts:
        - "3eora-mitm-proxy:${MITM_PROXY_IP:-host-gateway}"
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-coinsite
    restart: unless-stopped
    volumes:
      - ../coinsite:/app:delegated
      - /app/node_modules # anonymous vol: keep the image's node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.coinsite.rule=Host(`${DOMAIN_NAME}`) || Host(`www.${DOMAIN_NAME}`)"
      - "traefik.http.routers.coinsite.entrypoints=websecure"
      - "traefik.http.routers.coinsite.tls.certresolver=myresolver"
      - "traefik.http.services.coinsite.loadbalancer.server.port=8080"
      - "txnet.logging=true"

  # ===========================================================================
  # Redis — Session Store & Cache
  # ===========================================================================
  memory-data:
    image: ${DOCKER_REGISTRY}/redis:8.8-alpine
    container_name: ${STACK_NAME:-txnet}-redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_vol_internal:/data
    networks:
      - private_backend_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "${REDIS_PASSWORD}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # PostgreSQL — Primary Relational Database
  # ===========================================================================
  main-db:
    image: ${DOCKER_REGISTRY}/postgres:18-alpine
    container_name: ${STACK_NAME:-txnet}-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${MAIN_DB_USERNAME}
      - POSTGRES_PASSWORD=${MAIN_DB_PASSWORD}
      - POSTGRES_DB=${MAIN_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - private_backend_network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${MAIN_DB_USERNAME} -d ${MAIN_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # RabbitMQ — Message Broker
  # ===========================================================================
  rabbitmq:
    image: ${DOCKER_REGISTRY}/rabbitmq:4.2-management-alpine
    container_name: ${STACK_NAME:-txnet}-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - private_backend_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mq-admin.rule=Host(`mq.${DOMAIN_NAME}`)"
      - "traefik.http.routers.mq-admin.entrypoints=websecure"
      - "traefik.http.routers.mq-admin.tls.certresolver=myresolver"
      - "traefik.http.services.mq-admin.loadbalancer.server.port=15672"
