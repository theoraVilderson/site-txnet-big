# =============================================================================
# TXNet — Main Application Stack (Local Dev)
# =============================================================================
# Contains: Traefik, Go Auth Handler, NestJS Backends, Next.js Frontends,
#           Redis, PostgreSQL, RabbitMQ
#
# Usage:
#   docker compose -p txnet-main -f docker-compose.main.yml up -d --build
# =============================================================================

# Each service lives in its own file under compose/. `project_directory: .`
# keeps every relative path (build contexts, bind mounts, ./secrets) resolving
# from dev-docker/, exactly as when this was one file. A new service is a new
# compose/<name>.yml plus one entry here; a new named volume or network goes
# in compose/base.yml. docker-compose.dev.yml still overrides these services
# by name, as before.

include:
  - path: compose/base.yml
    project_directory: .
  - path: compose/edge.yml
    project_directory: .
  - path: compose/i18n.yml
    project_directory: .
  - path: compose/auth-service.yml
    project_directory: .
  - path: compose/bot-service.yml
    project_directory: .
  - path: compose/worker-service.yml
    project_directory: .
  - path: compose/metering-service.yml
    project_directory: .
  - path: compose/gateway-service.yml
    project_directory: .
  - path: compose/billing-service.yml
    project_directory: .
  - path: compose/notification-service.yml
    project_directory: .
  - path: compose/tenant-service.yml
    project_directory: .
  - path: compose/network-service.yml
    project_directory: .
  - path: compose/sub-service.yml
    project_directory: .
  - path: compose/frontends.yml
    project_directory: .
  - path: compose/data.yml
    project_directory: .
