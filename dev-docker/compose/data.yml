# Data plane: Redis, PostgreSQL, Mailpit, RabbitMQ.
# Included by ../docker-compose.main.yml with `project_directory: .`, so every
# relative path below resolves from dev-docker/, not from this folder.

services:
  # ===========================================================================
  # Redis — Session Store & Cache
  # ===========================================================================
  memory-data:
    extends: { file: compose/logging.yml, service: rotated-logs }
    image: ${DOCKER_REGISTRY}/redis:8.8-alpine
    container_name: ${STACK_NAME:-txnet}-redis
    mem_reservation: 64m # the k8s request: measured peak + headroom (K19)
    mem_limit: 256m
    # The port other services call; Kubernetes makes its Service from it (hosting K4).
    expose: ["6379"]
    restart: unless-stopped
    # An explicit ceiling and policy (OPS-1-v, H21): without one Redis grows
    # until the host kills it. noeviction because sessions, locks and rate
    # buckets live here — evicting one is a silent sign-out or a lost lock, a
    # refused write at least fails loudly. RedisMemoryHigh warns at 80%.
    # The password arrives as env, not as an argument, so Kubernetes keeps it
    # in the Secret and out of the pod spec (hosting K5, OPS-1-o-i); the shell
    # hands back to the image's entrypoint, which still drops to the redis user.
    command:
      - sh
      - -c
      - >-
        exec docker-entrypoint.sh redis-server
        --save ""
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
        --maxmemory ${REDIS_MAXMEMORY:-768mb}
        --maxmemory-policy noeviction
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # redis-cli reads its password from here, so the probe names none.
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis_vol_internal:/data
    networks:
      - private_backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # PostgreSQL — Primary Relational Database
  # ===========================================================================
  # Our image adds pgBackRest and archives every WAL segment (OPS-1-a,
  # hosting/contract.md H1/H2). The repository is chosen by PG_BACKUP_REPO_TYPE;
  # dev keeps it in a host dir, which guards a dropped table, not a lost disk.
  main-db:
    extends: { file: compose/logging.yml, service: rotated-logs }
    build:
      context: ./postgres
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
        APK_MIRROR: ${APK_MIRROR:-}
    image: txnet/postgres:18
    container_name: ${STACK_NAME:-txnet}-postgres
    mem_reservation: 768m # the k8s request: measured peak + headroom (K19)
    mem_limit: 2g
    # The port other services call; Kubernetes makes its Service from it (hosting K4).
    expose: ["5432"]
    restart: unless-stopped
    # Tuning (OPS-1-f, H10): the memory settings come from env so production
    # sizes them to its host — shared_buffers 25%, effective_cache_size 75% of
    # Postgres's memory (operations/environments.md); the defaults fit dev's 2 GB.
    # max_connections is the budget H8 counts against.
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_timeout=60
      -c "archive_command=pgbackrest --stanza=txnet archive-push %p"
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      -c work_mem=${PG_WORK_MEM:-16MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c log_min_duration_statement=${PG_SLOW_MS:-500}
      -c max_connections=100
    # Docker's 64 MB /dev/shm fails parallel queries; the default 10s stop
    # kills Postgres mid-checkpoint, and the next start replays WAL instead.
    shm_size: 256mb
    stop_grace_period: 60s
    environment:
      - POSTGRES_USER=${MAIN_DB_USERNAME}
      - POSTGRES_PASSWORD=${MAIN_DB_PASSWORD}
      - POSTGRES_DB=${MAIN_DB_NAME}
      - PG_BACKUP_REPO_TYPE=${PG_BACKUP_REPO_TYPE:-posix}
      - PG_BACKUP_S3_ENDPOINT=${PG_BACKUP_S3_ENDPOINT:-}
      - PG_BACKUP_S3_BUCKET=${PG_BACKUP_S3_BUCKET:-}
      - PG_BACKUP_S3_REGION=${PG_BACKUP_S3_REGION:-}
      - PG_BACKUP_S3_KEY=${PG_BACKUP_S3_KEY:-}
      - PG_BACKUP_S3_SECRET=${PG_BACKUP_S3_SECRET:-}
      - PG_BACKUP_SFTP_HOST=${PG_BACKUP_SFTP_HOST:-}
      - PG_BACKUP_SFTP_USER=${PG_BACKUP_SFTP_USER:-}
      - PG_BACKUP_SFTP_PATH=${PG_BACKUP_SFTP_PATH:-}
      # repo2 on S3 beside repo1 when the bucket is set (hosting K15, OPS-1-o-o)
      - PG_BACKUP_REPO2_S3_ENDPOINT=${PG_BACKUP_REPO2_S3_ENDPOINT:-}
      - PG_BACKUP_REPO2_S3_BUCKET=${PG_BACKUP_REPO2_S3_BUCKET:-}
      - PG_BACKUP_REPO2_S3_REGION=${PG_BACKUP_REPO2_S3_REGION:-}
      - PG_BACKUP_REPO2_S3_KEY=${PG_BACKUP_REPO2_S3_KEY:-}
      - PG_BACKUP_REPO2_S3_SECRET=${PG_BACKUP_REPO2_S3_SECRET:-}
      - PG_BACKUP_REPO2_S3_URI_STYLE=${PG_BACKUP_REPO2_S3_URI_STYLE:-host}
      - PG_BACKUP_REPO2_LOCK_DAYS=${PG_BACKUP_REPO2_LOCK_DAYS:-30}
    volumes:
      - postgres_data:/var/lib/postgresql
      - pg_socket:/var/run/postgresql
      - ${PG_BACKUP_LOCAL_DIR:-/var/backups/txnet/pg}:/repo
      - ./secrets/pg-backup-passphrase:/run/secrets/pg-backup-passphrase:ro
    networks:
      - private_backend_network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${MAIN_DB_USERNAME} -d ${MAIN_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # A crash recovery fsyncs the data directory first: over a minute on the
      # test server's disk. Compose only forgives misses here, but on k3s this is
      # the startup probe's budget, and a probe that fails kills (OPS-1-o-f, K6).
      start_period: 250s

  # ===========================================================================
  # Mailpit — dev SMTP sink (D-39). Catches every mail auth-service sends; the
  # inbox is at mail.${DOMAIN_NAME}. Not a relay: nothing leaves the machine.
  # ===========================================================================
  mailpit:
    extends: { file: compose/logging.yml, service: rotated-logs }
    image: ${DOCKER_REGISTRY}/axllent/mailpit:v1.27
    container_name: ${STACK_NAME:-txnet}-mailpit
    mem_reservation: 32m # the k8s request: measured peak + headroom (K19)
    mem_limit: 128m
    # The port other services call; Kubernetes makes its Service from it (hosting K4).
    expose: ["${SMTP_PORT:-1025}"]
    restart: unless-stopped
    # mailpit's own readiness command (hosting H24).
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - private_backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mail.${DOMAIN_NAME}`)"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls.certresolver=myresolver"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

  # ===========================================================================
  # RabbitMQ — Message Broker
  # ===========================================================================
  rabbitmq:
    extends: { file: compose/logging.yml, service: rotated-logs }
    image: ${DOCKER_REGISTRY}/rabbitmq:4.2-management-alpine
    container_name: ${STACK_NAME:-txnet}-rabbitmq
    mem_reservation: 256m # the k8s request: measured peak + headroom (K19)
    mem_limit: 1g
    # The ports other services call; Kubernetes makes its Service from them
    # (hosting K4): AMQP, and the Prometheus plugin the monitoring stack scrapes (K11).
    expose: ["5672", "15692"]
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      # One node name for the life of the volume (OPS-1-ac, hosting H23). The
      # default is rabbit@<container id>, so every recreate — and every move to
      # another server — started an empty node and left the queues behind it.
      - RABBITMQ_NODENAME=rabbit@localhost
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - private_backend_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mq-admin.rule=Host(`mq.${DOMAIN_NAME}`)"
      - "traefik.http.routers.mq-admin.entrypoints=websecure"
      - "traefik.http.routers.mq-admin.tls.certresolver=myresolver"
      - "traefik.http.services.mq-admin.loadbalancer.server.port=15672"
