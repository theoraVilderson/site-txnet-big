# i18n: locale-service and the two machine translators it asks.
# Included by ../docker-compose.main.yml with `project_directory: .`, so every
# relative path below resolves from dev-docker/, not from this folder.

services:
  # ===========================================================================
  # locale-service — i18n source of truth (gRPC). Every backend/frontend
  # service preloads a scope from here on boot and keeps it live via Watch.
  # ===========================================================================
  locale-service:
    extends: { file: compose/logging.yml, service: rotated-logs }
    build:
      context: ../i18n-platform/services/locale-service
      dockerfile: Dockerfile
      # The translations the image carries (K8); dev mounts ../locales over them.
      additional_contexts:
        locales: ../locales
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
    container_name: ${STACK_NAME:-txnet}-locale-service
    mem_reservation: 32m # the k8s request: measured peak + headroom (K19)
    mem_limit: 128m
    # The port other services call; Kubernetes makes its Service from it (hosting K4).
    expose: ["${LOCALE_SERVICE_HOST_PORT:-50051}"]
    restart: unless-stopped
    volumes:
      - ../locales:/locales:ro
      # Runtime-written text (catalog names, drafts) — state, back it up like
      # the database (ADR-0050).
      - locales_runtime:/locales-runtime
    environment:
      - GRPC_ADDR=:${LOCALE_SERVICE_HOST_PORT:-50051}
      - LOCALES_DIR=/locales
      - LOCALES_RUNTIME_DIR=/locales-runtime
    healthcheck:
      test: ["CMD", "/usr/local/bin/locale-service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    networks:
      - private_backend_network
    labels:
      - "txnet.logging=true"

  # ===========================================================================
  # translator — self-hosted LibreTranslate (Argos models). Drafts catalog text
  # for every language an admin did not write; a human publishes it (ADR-0050).
  # Private network only. Its models are built into our image, so it starts
  # with no route out (OPS-1-ai). Which models load is deployment data, never
  # code (§1.1): add a language's code to translator/languages when the
  # language is added to locales/; that rebuilds the image (R12).
  # ===========================================================================
  translator:
    extends: { file: compose/logging.yml, service: rotated-logs }
    build:
      context: ./translator
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
    image: txnet/translator:1.6.2
    container_name: ${STACK_NAME:-txnet}-translator
    mem_reservation: 512m # the k8s request: measured peak + headroom (K19)
    mem_limit: 1536m
    restart: unless-stopped
    environment:
      - LT_DISABLE_WEB_UI=true
      - LT_THREADS=${TRANSLATOR_THREADS:-2}
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      start_period: 600s
      retries: 5
    networks:
      - private_backend_network
    labels:
      - "txnet.logging=true"

  # ===========================================================================
  # translator-llm — a local LLM (Ollama) that drafts catalog text before
  # LibreTranslate is asked (ADR-0050 amendment 3). Free and offline: the model
  # is pulled once into the volume (on first start, if missing) and nothing
  # leaves the deployment after that. qwen2.5:3b is ~2 GB on disk and needs
  # ~3-4 GB RAM; no GPU required. No route to ollama.com (offline, national
  # internet): download the GGUF anywhere and run scripts/translator-llm-import.sh.
  # ===========================================================================
  translator-llm:
    extends: { file: compose/logging.yml, service: rotated-logs }
    image: ${DOCKER_REGISTRY}/ollama/ollama:0.6.8
    container_name: ${STACK_NAME:-txnet}-translator-llm
    mem_reservation: 2560m # the k8s request: measured peak + headroom (K19)
    mem_limit: 3g
    restart: unless-stopped
    volumes:
      - translator_llm_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${TRANSLATOR_LLM_KEEP_ALIVE:-30m}
      - TRANSLATOR_LLM_MODEL=${TRANSLATOR_LLM_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama serve & pid=$$!;
        sleep 5;
        ollama show "$$TRANSLATOR_LLM_MODEL" >/dev/null 2>&1 || ollama pull "$$TRANSLATOR_LLM_MODEL" || echo "model pull failed: drafts fall back to LibreTranslate";
        wait $$pid
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - private_backend_network
    labels:
      - "txnet.logging=true"
