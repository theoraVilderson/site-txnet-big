# The object-storage backup (F-018-m2-c; was restic, F-414-m, ADR-0120): a
# nightly mc mirror of every stored file into the backup bucket, each copy
# locked (dev-docker/backup/object-backup.sh says how). Included by
# ../docker-compose.main.yml with `project_directory: .`, so relative paths
# resolve from dev-docker/.
#
# The source follows OBJECT_STORAGE_DRIVER: the volume on `local`, the bucket
# on `s3`. The copies go off the server from the first run: OBJECT_BACKUP_S3_*
# in the env file (the backup bucket of B7, `txnet-backups`, prefix
# objects/<stack>/). Unset, every run fails and `storage.rules.yml`'s
# ObjectBackupStale says so.

services:
  object-backup:
    extends: { file: compose/health.yml, service: loop-health }
    # Pulled through ${DOCKER_REGISTRY}; the image ship.py sends bundles with (B7).
    image: ${DOCKER_REGISTRY}/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/usr/local/bin/object-backup.sh"]
    container_name: ${STACK_NAME:-txnet}-object-backup
    mem_reservation: 64m # the k8s request: measured peak + headroom (K19)
    mem_limit: 512m
    restart: unless-stopped
    volumes:
      - object_storage:/data/objects:ro
      - ./backup/object-backup.sh:/usr/local/bin/object-backup.sh:ro
      - ${NODE_TEXTFILE_DIR:-/var/lib/txnet/node-textfile}:/textfile
    environment:
      - OBJECT_BACKUP_AT=${OBJECT_BACKUP_AT:-23:00}
      - OBJECT_BACKUP_S3_ENDPOINT=${OBJECT_BACKUP_S3_ENDPOINT:-}
      - OBJECT_BACKUP_S3_BUCKET=${OBJECT_BACKUP_S3_BUCKET:-}
      - OBJECT_BACKUP_S3_ACCESS_KEY_ID=${OBJECT_BACKUP_S3_ACCESS_KEY_ID:-}
      - OBJECT_BACKUP_S3_SECRET_ACCESS_KEY=${OBJECT_BACKUP_S3_SECRET_ACCESS_KEY:-}
      - OBJECT_BACKUP_S3_PREFIX=${OBJECT_BACKUP_S3_PREFIX:-objects/${STACK_NAME:-txnet}/}
      - OBJECT_BACKUP_S3_LOCK_DAYS=${OBJECT_BACKUP_S3_LOCK_DAYS:-7}
      - OBJECT_STORAGE_DRIVER=${OBJECT_STORAGE_DRIVER:-local}
      - OBJECT_STORAGE_S3_ENDPOINT=${OBJECT_STORAGE_S3_ENDPOINT:-}
      - OBJECT_STORAGE_S3_BUCKET=${OBJECT_STORAGE_S3_BUCKET:-}
      - OBJECT_STORAGE_S3_ACCESS_KEY_ID=${OBJECT_STORAGE_S3_ACCESS_KEY_ID:-}
      - OBJECT_STORAGE_S3_SECRET_ACCESS_KEY=${OBJECT_STORAGE_S3_SECRET_ACCESS_KEY:-}
    networks:
      - private_backend_network
