# Container healthchecks for every Node service of the main stack (OPS-1-n, H15).
# Not an `include:` entry: a service pulls one in with
#   extends: { file: compose/health.yml, service: http-health }      (or heartbeat-health)
# and each template extends the log rotation, because a service has one
# `extends` and both must apply. That inner path is from this folder, not
# dev-docker/: compose resolves a nested extends from the file holding it.
services:
  # `/health` answers 200 only while `SELECT 1` on the pool succeeds
  # (shared-core HealthModule). HEALTH_PATH is for an app with no global prefix.
  http-health:
    extends: { file: logging.yml, service: rotated-logs }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+(process.env.HEALTH_PATH||'/'+(process.env.GLOBAL_PREFIX||'api')+'/health')).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    # Kubernetes' liveness and startup check (LIVE-1-r, hosting K6): the same
    # URL, but any answer, 503 included, is a live process. Only no answer is a
    # hung one. The healthcheck above stays readiness, so a main-db outage takes
    # a pod out of its Service and never restarts it.
    x-liveness: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+(process.env.HEALTH_PATH||'/'+(process.env.GLOBAL_PREFIX||'api')+'/health')).then(()=>process.exit(0),()=>process.exit(1))"]

  # worker-service and metering-service serve no HTTP (ADR-0027): the broker
  # service touches /tmp/healthy every 15s until its channel closes.
  heartbeat-health:
    extends: { file: logging.yml, service: rotated-logs }
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/healthy) )) -lt 60"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  # pg-backup and object-backup (hosting H24): the loop touches /tmp/healthy
  # every 30s pass, and /tmp/busy while a backup or drill runs. A run is not a
  # hung loop until it is 12h old — half the daily schedule, so a run that
  # would collide with the next one is the first to fail the check.
  loop-health:
    extends: { file: logging.yml, service: rotated-logs }
    healthcheck:
      test: ["CMD-SHELL", "age() { echo $$(( $$(date +%s) - $$(stat -c %Y $$1) )); }; { test -f /tmp/healthy && test $$(age /tmp/healthy) -lt 120; } || { test -f /tmp/busy && test $$(age /tmp/busy) -lt 43200; }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
