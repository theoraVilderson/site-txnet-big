# The certificate the origin presents to its edges (ADR-0165 point 4, hosting O13).
# A Go template: Traefik's file provider renders it with the gateway's env.
#
# EDGE_ORIGIN_CERT names the pair, bound read-only from
# dev-docker/secrets/origin-cert/ (scripts/edge/origin-cert.sh issues it).
# Unset, nothing is loaded and the gateway serves Traefik's default certificate.
#
# EDGE_ORIGIN_CERT_DEFAULT=true makes the pair the default certificate, served
# for a name no certificate holds: a Custom Hostname's pull carries the
# reseller's domain as SNI, and Full (strict) checks the certificate against
# the fallback origin, which the pair covers. A domestic edge verifies none
# (NIN-1-a). Otherwise the pair is one certificate among none, and an unknown
# SNI gets Traefik's own (O4).
{{- with env "EDGE_ORIGIN_CERT" }}
tls:
{{- if eq (env "EDGE_ORIGIN_CERT_DEFAULT") "true" }}
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/origin-cert/{{ . }}.pem
        keyFile: /etc/traefik/origin-cert/{{ . }}.key
{{- else }}
  certificates:
    - certFile: /etc/traefik/origin-cert/{{ . }}.pem
      keyFile: /etc/traefik/origin-cert/{{ . }}.key
{{- end }}
{{- end }}
