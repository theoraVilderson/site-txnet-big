# The origin answers only Cloudflare (ADR-0129 amendment 1, EDGE-1-g).
# A Go template: Traefik's file provider renders it with the gateway's env.
#
# EDGE_ORIGIN_PULL:
#   off       no client certificate asked for; CF-Connecting-IP is dropped.
#   optional  a certificate is checked if presented (dev: Cloudflare pulls get
#             the visitor's address, a direct caller still gets in).
#   anything else — `required` in production — a TLS request must carry a
#             certificate from OUR origin-pull CA, never Cloudflare's shared
#             one, which any Cloudflare customer can send, or come from a
#             domestic edge's ranges. A typo fails closed.
#
# Either way the handshake only *asks* (VerifyClientCertIfGiven): a domestic
# edge has no certificate to give (NIN-1-a), so on `required` the plugin
# refuses the rest (`requirePull`, NIN-1-b4). A certificate from another CA is
# still refused at the handshake. The options are `default`, so they hold for
# every router and for an unknown SNI.
# scripts/edge/origin-pull.sh issues the CA and uploads the client certificate.
{{- $mode := env "EDGE_ORIGIN_PULL" | default "off" }}
http:
  middlewares:
    # On every router through both entrypoints (the gateway's command line).
    edge-client-ip:
      plugin:
        edgeclientip:
          # Where a reseller's own CDN names the visitor, first found wins; a
          # CDN with none of these is read from X-Forwarded-For. The value is a
          # claim, counted beside the address and never trusted (ADR-0129
          # amendment 2). CloudFront-Viewer-Address is `ip:port`.
          claimHeaders: [True-Client-IP, AR-Real-IP, Fastly-Client-IP, X-Azure-ClientIP, CloudFront-Viewer-Address]
{{- with env "EDGE_VISITOR_HEADER" }}
          # The domestic edges (NIN-1-b4, hosting O12): from their ranges, the
          # header they overwrite with the visitor is the client address and
          # nothing else is read. The ranges are the firewall's own copies (O8).
          visitorHeader: {{ . }}
          edgeRangeFiles: [{{ env "EDGE_RANGE_FILES" | splitList "," | join ", " }}]
{{- end }}
{{- if and (ne $mode "off") (ne $mode "optional") }}
          requirePull: true
{{- end }}
    # Also on every router: a response to a signed-in caller (bearer token or a
    # session cookie) or one that sets a cookie leaves `private, no-store` when
    # the service set no Cache-Control (ADR-0129 decision 8, EDGE-1-j).
    private-cache:
      plugin:
        privatecache: {}
{{- if ne $mode "off" }}
tls:
  options:
    default:
      minVersion: VersionTLS12
      clientAuth:
        caFiles:
          - /etc/traefik/origin-pull/ca.pem
        clientAuthType: VerifyClientCertIfGiven
{{- end }}
