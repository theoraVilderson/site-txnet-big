# Air configuration for live reload during development.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/server"
bin = "./tmp/main"
include_dir = ["cmd", "internal", "configs", "locales"]
include_ext = ["go", "json"]
exclude_dir = ["tmp"]
delay = 1000

[misc]
clean_on_exit = true