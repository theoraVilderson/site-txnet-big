# Role -> allowed permissions. Used as defense-in-depth.
#
# `auth-handler` enforces this on every gated request: a token claiming a
# permission its role is not granted here is refused 403 before the request
# reaches any service. Nest enforces the same names again with
# `PermissionsGuard`, and `tools/contracts.py` is what makes the two lists
# agree — three names were enforced in TypeScript and missing here (F-085),
# which made those routes unreachable rather than merely ungated.
#
# Adding a permission here does NOT grant it to anyone: the token's
# `permissions[]` comes from the database role. This file can only take a
# claimed permission away.
#
# A role is keyed by `identity.role.name` **exactly as `prisma/seed.js`
# spells it**, case included — the token's `roleName` claim, never its
# `roleId`, which is a UUID that differs on every database (ADR-0037). A role
# missing here is refused every gated request, and `tools/contracts.py` fails
# when a seeded role has no entry.
#
# `*` allows every permission, including one no line here names yet (F-101-d,
# ADR-0043 as amended). Only `SuperAdmin` may carry it — `tools/contracts.py`
# fails otherwise — and only the bare `*`: `user.*` is an ordinary name.
roles:
  # Above `Admin` in the impersonation rank. The seed makes the platform owner
  # this role, and the database grants it the one permission `*`, so a feature
  # that adds a permission needs no line here for SuperAdmin to hold it.
  SuperAdmin:
    permissions:
      - *
      # Tenant administration — resellers, the packages sold to them, their
      # subscription and status (F-018, ADR-0058). Listed although `*` already
      # allows it, because it is the one permission **no named role holds**:
      # the platform owner's own staff reach reseller administration as
      # SuperAdmin and nobody else (user, 2026-09-17). `TenantPackageService`
      # and its siblings still refuse any tenant but the platform owner's, so
      # this line is the outer door, never the boundary.
      - tenant.manage
  Admin:
    permissions:
      - user.read
      - user.write
      - user.impersonate
      # Platform-wide background workers: see what exists, schedule, switch
      # off, run now. Not tenant-scoped by design — a worker is a platform
      # process, not a reseller's — so the permission is what confines it.
      - worker.manage
      # Rotate a bot's webhook secret.
      - bot.webhook_rotate
      # The reseller-wide realtime feed. It carries events about *other
      # people* in the tenant, so it is an operator's view and membership of
      # the tenant is not enough on its own. `gateway-service` also requires
      # an exact tenant match; this is the other half.
      - realtime.tenant.read
      # The platform's settlement surface (F-096-e). Not the boundary on its
      # own: `SettlementService.assertOperator` also requires the platform
      # owner's tenant, because a reseller administers its own roles.
      - settlement.manage
      # Payment gateway management (F-102-c, D-31). A tenant's Admin manages
      # its own gateways; `GatewayAdminService` keeps everyone else's, the
      # platform's and verification for the platform owner.
      - gateway.manage
      # Confirming a verifying payment by hand (F-092-z, ADR-0044 decision 6),
      # on those same gateways; `ManualConfirmService` confines a tenant to its
      # own users' payments on its own gateway configs.
      - payment.confirm_manual
      # Coupon and gift-code management (F-502-a, D-33). A tenant's Admin
      # manages its own coupons; the service keeps platform coupons and other
      # tenants' for the platform owner (F-502-c).
      - coupon.manage
      # Catalog management (F-026-d, D-34). A tenant's Admin manages its own
      # catalog; the service keeps platform items for the platform owner.
      - catalog.manage
      # Campaign drafts (F-035-c). A tenant's Admin drafts its own tenant's
      # campaigns; the service keeps platform-wide ones for the platform owner.
      - campaign.manage
      # Manual billing-wallet adjustment (F-019-a, D-41). Only the platform
      # owner's Admin gets through: the service refuses every other tenant.
      - tenant_billing.adjust
      # A reseller's billing top-up (F-019-b, ADR-0056). The service admits it
      # only inside a reseller; its owner needs no permission.
      - tenant_billing.topup
  Support:
    permissions:
      - user.read
  user:
    permissions:
      - self.read
      - self.write
