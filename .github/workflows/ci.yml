name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  GO_VERSION: '1.22'

jobs:
  # ---------------------------------------------------------------------------
  # The five docs gates from AGENTS.md → "Before declaring any work done".
  # All five must pass; they need nothing but python3 and the repo itself.
  # ---------------------------------------------------------------------------
  gates:
    name: docs gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: docs-check
        run: python3 tools/docs-check.py
      - name: backlog
        if: ${{ !cancelled() }}
        run: python3 tools/backlog.py
      - name: features-scan
        if: ${{ !cancelled() }}
        run: python3 tools/features-scan.py --check
      - name: where
        if: ${{ !cancelled() }}
        run: python3 tools/where.py --check
      - name: conventions
        if: ${{ !cancelled() }}
        run: python3 tools/conventions.py

  # ---------------------------------------------------------------------------
  # NestJS workspace: jest through Nx.
  # ---------------------------------------------------------------------------
  backend:
    name: backend (jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: txnet-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: txnet-backend/package-lock.json

      - run: npm ci

      # `prisma generate` only reads the schema, but the datasource block still
      # requires DATABASE_URL to be set — no database is contacted.
      - name: prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: npx prisma generate

      - name: jest
        run: npx nx run-many -t test --parallel=2 --skip-nx-cache

      # jest transpiles without type-checking (`auth-service/jest.config.cts`
      # sets `isolatedModules`, which is what keeps the suite under 20s), and
      # the webpack build below is `transpileOnly` — so this step is the only
      # thing in CI that type-checks the spec files.
      - name: tsc (specs)
        run: npx tsc -p auth-service/tsconfig.spec.json --noEmit

      # A webpack build is the only thing that proves a workspace-library
      # import (`@txnet-backend/*`) actually resolves: ts-loader runs with
      # `transpileOnly`, so a wrong alias type-checks, bundles a
      # "Cannot find module" stub, and only fails when the service boots.
      - name: webpack build
        run: npx nx run-many -t build --parallel=2 --skip-nx-cache

  # ---------------------------------------------------------------------------
  # auth-service end to end: the real app over HTTP, against a real Postgres
  # and a real Redis in containers (testcontainers). Docker is available on
  # the runner, so the images come straight from Docker Hub — the defaults in
  # the code point at the mirror the dev environment has to use instead.
  # ---------------------------------------------------------------------------
  backend-e2e:
    name: auth-service (e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: txnet-backend
    env:
      TEST_POSTGRES_IMAGE: postgres:18-alpine
      TEST_REDIS_IMAGE: redis:8.8-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: txnet-backend/package-lock.json

      - run: npm ci

      # The e2e run builds its own schema with `prisma db push`; the client
      # still has to exist before anything imports it.
      - name: prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: npx prisma generate

      - name: jest (e2e)
        run: npm run test:e2e

  # ---------------------------------------------------------------------------
  # The `*.int.spec.ts` tier: the Redis-backed stores against a real Redis in a
  # container (testcontainers). These were written but ran nowhere — a store
  # whose Lua script or KEEPTTL assumption broke would have shipped green.
  # ---------------------------------------------------------------------------
  backend-int:
    name: auth-service (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: txnet-backend
    env:
      TEST_REDIS_IMAGE: redis:8.8-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: txnet-backend/package-lock.json

      - run: npm ci

      # No database is contacted; the client just has to exist before the
      # specs' imports resolve.
      - name: prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: npx prisma generate

      - name: jest (integration)
        run: npm run test:int

  # ---------------------------------------------------------------------------
  # Go modules of the workspace (auth-handler + i18n-platform).
  # ---------------------------------------------------------------------------
  go:
    name: go (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum

      # go.work has no root module, so `go test ./...` must run per member.
      - name: resolve workspace modules
        id: modules
        run: |
          {
            echo 'dirs<<EOM'
            go work edit -json | python3 -c 'import json,sys; [print(u["DiskPath"]) for u in json.load(sys.stdin)["Use"]]'
            echo 'EOM'
          } >> "$GITHUB_OUTPUT"

      - name: go vet
        run: |
          while read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::go vet $dir"
            (cd "$dir" && go vet ./...)
            echo "::endgroup::"
          done <<< '${{ steps.modules.outputs.dirs }}'

      - name: go test
        run: |
          while read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::go test $dir"
            (cd "$dir" && go test ./...)
            echo "::endgroup::"
          done <<< '${{ steps.modules.outputs.dirs }}'

  # ---------------------------------------------------------------------------
  # The shared Node locale client. Every Node service imports the compiled
  # `dist/`, so that is what is tested — plus a check that `dist/` is actually
  # the current build of `client.ts`, since a stale one ships silently.
  # ---------------------------------------------------------------------------
  locale-client-node:
    name: locale-client (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: i18n-platform/clients/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: i18n-platform/clients/node/package-lock.json

      - run: npm ci

      - name: node --test
        run: npm test

      - name: dist is the current build of client.ts
        run: |
          npm run build
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale — run 'npm run build' in i18n-platform/clients/node and commit the result"
            git --no-pager diff --stat -- dist
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The two Next.js apps: eslint + vitest.
  # ---------------------------------------------------------------------------
  frontend:
    name: ${{ matrix.app }} (lint + vitest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [site-pwa, coinsite]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci

      - name: eslint
        run: npm run lint

      - name: vitest
        run: npm test
