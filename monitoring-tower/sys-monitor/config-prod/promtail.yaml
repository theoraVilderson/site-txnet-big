server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker_txnet
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # فیلتر کردن فقط روی کانتینرهای prodtxnet و devtxnet
      - source_labels: ["__meta_docker_container_label_txnet_logging"]
        regex: "true"
        action: keep

      # تمیز کردن نام کانتینر برای نمایش در گرافانا
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container_name"
      # ۳. (اختیاری) اضافه کردن نام سرویس به عنوان یک متغیر در گرافانا
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
